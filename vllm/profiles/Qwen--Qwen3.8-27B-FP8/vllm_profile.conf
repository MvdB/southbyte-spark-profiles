# vLLM Profil – Qwen/Qwen3.8-27B-FP8
#
# STAND 2026-08-16: GELAUFEN. Erster Start auf dem GB10 mit vLLM v0.26.0,
# Kontext 131072 wie unten gesetzt, KV-Cache 2 111 715 Token. Deutscher
# Smoke-Test sauber: 17*23 = 391, Rhein-Erklaerung korrekt, der Parser qwen3
# trennt zuverlaessig (2010 Zeichen Analyse in reasoning, zwei Saetze content).
#
# Gemessen:
#   Generierung  7,8 tok/s (Zaehler der Engine, ueber mehrere Minuten stabil)
#   Prefill      ~1300 tok/s bei 4391 Prompt-Token, ~950 bei 1091
#
# ACHTUNG bei Zeitmessungen: reasoning_content kommt NICHT als Stream-Delta.
# Im Stream trifft erst content ein, also nach der kompletten Denkphase. Wer
# "Zeit bis zum ersten Token" so misst, misst die Denkzeit mit und bekommt hier
# 15 s statt Millisekunden. Dieselbe Falle gilt beim Muse-Glimmer.
#
# Ebenfalls eine Falle: die Zeile "Avg prompt throughput: 7,6 tokens/s" im Log
# ist der Mittelwert ueber das 10-Sekunden-Fenster, nicht die Prefill-Rate. Sie
# sieht nach einem kaputten Prefill aus und ist keiner — siehe die Messung oben,
# isoliert mit max_tokens=1 und einmaligen Prompts.
#
# Gegentest Prefix-Caching (der Start warnt, dass es im Mamba-Cache-Modus
# 'align' fuer die Linear-Attention-Schichten experimentell sei): kein Effekt.
# Bei 4391 Token 1374 tok/s mit gegen 1315 ohne — Rauschen. Nicht abschalten.
#
# DeepGemm schaltet vLLM hier von selbst ab ("Auto-disabled DeepGemm for
# model_type=qwen3_5_text on Blackwell. DeepGemm E8M0 scale format causes
# accuracy degradation") und faellt auf CUTLASS zurueck. Der Hinweis weiter
# unten zu VLLM_USE_DEEP_GEMM ist damit gegenstandslos: es gibt nichts von Hand
# abzuschalten.
#
# Rezept: https://recipes.vllm.ai/Qwen/Qwen3.8-27B?variant=fp8
#   vllm serve Qwen/Qwen3.8-27B-FP8 \
#     --tensor-parallel-size 4 --max-model-len 262144 \
#     --kv-cache-dtype fp8 --reasoning-parser qwen3
#
# Zwei Abweichungen davon, beide notwendig:
#
# 1. KEIN Tensor-Parallel. Das Rezept nennt TP=4 und sagt dazu, dass dafuer eine
#    GB300-Schublade gebraucht wird — vier Karten. Der DGX Spark ist ein
#    einzelner GB10. TP=4 wuerde beim Start scheitern, nicht langsam laufen.
#    Der Runner setzt ohnehin TP=1, hier steht es nur zur Erinnerung.
#
# 2. Kontext von 262144 auf 131072 halbiert. Die 262k des Rezepts sind an die
#    TP=4-Konfiguration gebunden ("one GB300 tray for maximum KV cache"). Auf
#    einem Knoten mit 121 GB nutzbarem Speicher konkurriert der KV-Cache mit
#    27 GB Gewichten; 131072 ist der Wert, mit dem Qwen3.6-27B-FP8 hier laeuft,
#    und damit der belastbare Ausgangspunkt. Hoeher gehen erst, wenn gemessen.
#
# Uebernommen wird aus dem Rezept: FP8-Checkpoint, kv-cache-dtype fp8 und der
# Reasoning-Parser qwen3.

PROFILE_VLLM_COMPATIBLE=1
# Familienrichtlinie ist der regulaere Upstream-Tag; das Rezept verlangt
# mindestens 0.17.0, v0.26.0 liegt darueber.
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:v0.26.0'
PROFILE_BASH_WRAPPER=0
PROFILE_DTYPE='bfloat16'
PROFILE_QUANTIZATION='fp8'
PROFILE_GPU_MEM_UTIL='0.85'
PROFILE_MAX_MODEL_LEN=131072
PROFILE_MAX_NUM_SEQS=4
PROFILE_MAX_NUM_BATCHED_TOKENS=4096
PROFILE_ENFORCE_EAGER=0
PROFILE_TRUST_REMOTE_CODE=0
PROFILE_KV_CACHE_DTYPE='fp8'
PROFILE_VLLM_EXTRA_ARGS=('--reasoning-parser' 'qwen3')
PROFILE_NOTES='2026-08-16 gelaufen: 7,8 tok/s Generierung, ~1300 tok/s Prefill, deutscher Smoke-Test sauber, Parser qwen3 trennt. FP8 dense 27B. Rezept-Werte ausser TP (Spark hat eine GPU, Rezept nennt vier) und Kontext (262k ist an TP=4 gebunden, hier 131072 wie beim 3.6er). reasoning_content kommt nicht als Stream-Delta — TTFT-Messungen enthalten sonst die Denkzeit.'

# Bewusst NICHT gesetzt: VLLM_USE_DEEP_GEMM=0. Beim 3.6er-Profil steht das noch
# drin, es stammt aus vLLM 0.24, wo DeepGEMM sm_120 nicht kannte. Hier erledigt
# vLLM es selbst (siehe Kopf), von Hand ist nichts zu tun.

# Noch nicht ausprobiert: spekulatives Dekodieren. Der Checkpoint bringt MTP mit
# — mtp_num_hidden_layers: 1 in der text_config, am 2026-08-16 nachgesehen. Das
# war im vorigen Stand dieses Profils noch eine offene Frage. Was ein MTP-Kopf
# hier bringt, ist ungemessen; beim Muse-Glimmer hat DFlash 5,3x gebracht, das
# ist aber ein anderes Verfahren und kein Anhaltspunkt.
