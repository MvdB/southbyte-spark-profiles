# vLLM Profil – ornith-ai/Ornith-1.5-35B-A3B-NVFP4
#
# 2026-08-21 vorbereitet, das Modell ist noch NICHT gesynct. Nach dem Sync
# diese Datei nach ~/hf_models/ornith-ai--Ornith-1.5-35B-A3B-NVFP4/ kopieren
# und die Werte am ersten Start gegen 'docker logs vllm-server' pruefen.
#
# KEIN REZEPT VORHANDEN. recipes.vllm.ai fuehrt weder Ornith noch ein
# Qwen3.5-MoE-Modell (Stand 21.08.2026, 173 Rezepte geprueft). Die Werte hier
# sind deshalb nicht abgeschrieben, sondern hergeleitet — aus zwei Quellen:
#
#   1. ornith-ai--Ornith-1.0-35B-FP8, dieselbe Architekturfamilie, auf dieser
#      Maschine gelaufen. Von dort stammen TRUST_REMOTE_CODE, die Parser und
#      vor allem MAX_NUM_BATCHED_TOKENS=4096.
#   2. RedHatAI--Qwen3.8-27B-NVFP4, dieselbe modelopt-Quantisierung.
#
# MAX_NUM_BATCHED_TOKENS=4096 NICHT SENKEN. Beim FP8-Vorgaenger brach der
# Start an einem Mamba-align-Assert ab: block_size 2096 muss <=
# max_num_batched_tokens sein, und Prefix-Caching ist standardmaessig an — es
# abzuschalten, indem man das Flag weglaesst, funktioniert nicht.
#
# Aus config.json der NVFP4-Fassung gelesen:
#   architectures        Qwen3_5MoeForConditionalGeneration
#   40 Schichten, davon 30 lineare und 10 volle Attention (Hybrid)
#   256 Experten, 8 aktiv je Token  ->  35B gesamt, ~3B aktiv
#   quant_method         modelopt 0.45.0, gemischt:
#                        Attention FP8, Experten und lm_head NVFP4 (W4A16)
#   max_position_embeddings 262144
#
# KEIN explizites PROFILE_QUANTIZATION: vLLM liest quant_method und die
# ignore-Liste aus der config.json selbst. Lehre aus den Ling-3.0-Versuchen.
#
# MAX_MODEL_LEN=32768 statt der nativen 262144 — bewusst gleich dem
# FP8-Vorgaenger. NVFP4 macht Platz fuer mehr KV-Cache, aber ein groesserer
# Kontext macht die beiden Ornith-Zeilen unvergleichbar. Wer die Kontextlaenge
# messen will, macht dafuer einen eigenen Eintrag auf.
#
# ENFORCE_EAGER=1 fuer den ersten Start, wie beim FP8-Vorgaenger: Hybrid-
# Attention plus MoE, da ist der konservative Weg der schnellere. Laeuft der
# Start sauber, auf 0 setzen und neu messen — beim Qwen3.8-NVFP4 haben
# CUDA-Graphs auf dieser Maschine problemlos funktioniert.
#
# MTP-KOPF IST IM CHECKPOINT. Die ignore-Liste der Quantisierung nimmt "mtp*"
# und "mtp.layers.0*" aus, config.json fuehrt mtp_num_hidden_layers=1. Damit
# gilt hier dasselbe wie bei RedHatAI--Qwen3.8-27B-NVFP4: Spekulation ohne
# separaten Drafter, eingeschaltet ueber vllm_extra_args am Testplaneintrag,
# nicht hier im Profil:
#   --speculative-config {"method":"mtp","num_speculative_tokens":3}
# Das gibt einen zweiten Messpunkt fuer MTP auf dieser Maschine, diesmal auf
# einem MoE-Modell. Vorher lesen, was beim Qwen-Lauf herauskam.

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:v0.27.1'
PROFILE_BASH_WRAPPER=0
PROFILE_DTYPE='bfloat16'
PROFILE_QUANTIZATION=''
PROFILE_GPU_MEM_UTIL='0.88'
PROFILE_MAX_MODEL_LEN=32768
PROFILE_MAX_NUM_SEQS=2
PROFILE_MAX_NUM_BATCHED_TOKENS=4096
PROFILE_ENFORCE_EAGER=1
PROFILE_TRUST_REMOTE_CODE=1
PROFILE_KV_CACHE_DTYPE='fp8'
PROFILE_TOOL_CALL_PARSER='qwen3_xml'
PROFILE_REASONING_PARSER='qwen3'
PROFILE_ENABLE_AUTO_TOOL_CHOICE=1
PROFILE_VLLM_EXTRA_ARGS=()
PROFILE_NOTES='2026-08-21 vorbereitet, noch nicht gesynct und nicht gelaufen. Kein Rezept auf recipes.vllm.ai; Werte hergeleitet aus Ornith-1.0-35B-FP8 (gleiche Architekturfamilie, gleiche Maschine) und RedHatAI--Qwen3.8-27B-NVFP4 (gleiche modelopt-Quantisierung). Arch Qwen3_5MoeForConditionalGeneration, 40 Schichten hybrid, 256 Experten / 8 aktiv, Attention FP8 + Experten NVFP4. MTP-Kopf im Checkpoint, Einschalten ueber den Testplaneintrag. Lizenz MIT laut Modellkarte, vor Veroeffentlichung gegen die Dateien im Repo pruefen.'
