PROFILE_NOTES='2026-08-23 angelegt, noch nicht gelaufen. Abgeleitet von RedHatAI--Qwen3.8-27B-NVFP4, das auf dieser Maschine laeuft — kein eigenes Rezept auf recipes.vllm.ai (404), wohl aber eines fuer die Basis Qwen/Qwen3.8-27B. Die Ableitung ist geprueft und nicht geraten: beide Checkpoints tragen dieselbe Architektur Qwen3_5ForConditionalGeneration, dieselben 64 Schichten und dieselbe Quantisierung (compressed-tensors mixed-precision). Die Gewichtsskalen laufen ueber strategy=channel, NICHT ueber strategy=block — die DeepGEMM-Falle, an der Laguna-XS-2.1-FP8 zweimal am Start scheiterte, greift hier also nicht. 24,7 GB. Uncensored-Fassung derselben Basis, die in der Kohorte bereits dreimal steht (FP8, NVFP4, NVFP4-MTP); der Vergleichswert liegt in 04_security und 08_guardrails, nicht in der Qualitaet.'
