# vLLM Profil – primitive-ai--Kolibri-1-NVFP4
#
# GEMESSEN am 2026-10-07 — laeuft. Laden 406 s, 101 GiB belegt, KV-Pool 1,61 Mio.
# Token (fp8: 764k), 32,0 tok/s reproduzierbar. Werkzeugaufruf belegt.
#
# Dieselbe Architektur wie Aleph-Alpha/Kolibri-1 (model_type kolibri1,
# Kolibri1ForCausalLM), also dasselbe Plugin und dasselbe Image — aber
# compressed-tensors NVFP4 statt fp8-Block. 48 statt 79 GB.
#
# Warum es diese Zeile gibt: der fp8-Lauf passt nur knapp. Er belegt 101 von
# 121,6 GiB und starb im ersten Anlauf mit OOM; erst 0.80/8k/1 Sequenz machte
# ihn stabil. Damit steht max_model_len 8192 gegen eine Denkspur, die allein
# 6000 Token zieht. NVFP4 spart ueber 30 GB und koennte beides aufloesen —
# mehr Kontext UND mehr Luft.
#
# GEKLAERT: das Plugin TRAEGT NVFP4 (compressed-tensors). Keine Sonderbehandlung
# noetig, dasselbe Image, dieselben Flags.
#
# Wichtig fuers Verstaendnis der Zahlen: der gesparte Platz landet NICHT im
# Freiraum, sondern im KV-Cache. Bei GPU_MEM_UTIL 0.80 nimmt vLLM in beiden
# Faellen 80 % des Speichers — nach den kleineren Gewichten bleibt hier nur mehr
# davon fuer den Cache uebrig. Deshalb traegt diese Fassung einen groesseren
# Kontext, und genau dafuer gibt es die dritte Testplanzeile mit 32k.
#
# Die Grenzen hier sind bewusst DIESELBEN wie bei fp8. Wer die Zeilen
# vergleichen will, darf nur EINEN Unterschied haben: die Gewichte. Erst wenn
# NVFP4 stabil laeuft, lohnt es sich, den Kontext hochzudrehen — dann aber als
# dritte Zeile, nicht durch Aendern dieser.

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='spark-kolibri1:v1'   # dasselbe Image wie fp8
PROFILE_DTYPE='bfloat16'
PROFILE_GPU_MEM_UTIL='0.80'
PROFILE_MAX_MODEL_LEN=8192
PROFILE_MAX_NUM_SEQS=1
PROFILE_ENFORCE_EAGER=1
PROFILE_TRUST_REMOTE_CODE=0
PROFILE_KV_CACHE_DTYPE='fp8'
PROFILE_REASONING_PARSER='kolibri1'
PROFILE_TOOL_CALL_PARSER='kolibri1'
PROFILE_ENABLE_AUTO_TOOL_CHOICE=1
PROFILE_NOTES='2026-10-07 GEMESSEN: Laden 406 s (fp8 511 s), 101 GiB belegt wie fp8, KV-Pool 1,61 Mio. Token gegen 764k bei fp8, 32,0 tok/s in zwei Laeufen identisch. Deutsche Antwort sachlich richtig und ausfuehrlicher als fp8 (nennt die Ruecklagenpflicht nach 5a Abs. 3 GmbHG) — EINZELFALL, traegt nichts, bei dieser Modellklasse kippt jedes fuenfte Einzelurteil. Werkzeugaufruf belegt. Das Plugin traegt NVFP4 ohne Sonderbehandlung. ACHTUNG: 1499 von 1500 Token gingen bei einer 300-Woerter-Aufgabe ins Denken — die Playbooks brauchen grosszuegige Token-Budgets, sonst messen wir Abschneiden statt Qualitaet. NVFP4-Fassung von Aleph-Alpha/Kolibri-1 durch primitive-ai, Apache-2.0, compressed-tensors. Gedacht als Rueckfall, falls fp8 im Betrieb doch kippt, und als Leistungsvergleich. Grenzen absichtlich identisch zur fp8-Zeile, damit der Vergleich genau einen Unterschied hat. OFFEN: ob das Plugin NVFP4 traegt.'
