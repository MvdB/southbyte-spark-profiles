# vLLM Profil – primitive-ai--Kolibri-1-NVFP4
#
# VORBEREITET am 2026-10-07, NOCH NICHT GEMESSEN. Das Modell laedt noch.
#
# Dieselbe Architektur wie Aleph-Alpha/Kolibri-1 (model_type kolibri1,
# Kolibri1ForCausalLM), also dasselbe Plugin und dasselbe Image — aber
# compressed-tensors NVFP4 statt fp8-Block. 48 statt 79 GB.
#
# Warum es diese Zeile gibt: der fp8-Lauf passt nur knapp. Er belegt 101 von
# 121,6 GiB und starb im ersten Anlauf mit OOM; erst 0.80/8k/1 Sequenz machte
# ihn stabil. Damit steht max_model_len 8192 gegen eine Denkspur, die allein
# 6000 Token zieht. NVFP4 spart ueber 30 GB und koennte beides aufloesen —
# mehr Kontext UND mehr Luft.
#
# OFFEN, vor dem ersten Start zu klaeren: ob das Plugin mit NVFP4-Gewichten
# umgeht. Es bringt die Architektur mit, ueber die Quantisierung sagt seine
# Beschreibung nichts. Erster Start = der Test, wie bei fp8.
#
# Die Grenzen hier sind bewusst DIESELBEN wie bei fp8. Wer die Zeilen
# vergleichen will, darf nur EINEN Unterschied haben: die Gewichte. Erst wenn
# NVFP4 stabil laeuft, lohnt es sich, den Kontext hochzudrehen — dann aber als
# dritte Zeile, nicht durch Aendern dieser.

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='spark-kolibri1:v1'   # dasselbe Image wie fp8
PROFILE_DTYPE='bfloat16'
PROFILE_GPU_MEM_UTIL='0.80'
PROFILE_MAX_MODEL_LEN=8192
PROFILE_MAX_NUM_SEQS=1
PROFILE_ENFORCE_EAGER=1
PROFILE_TRUST_REMOTE_CODE=0
PROFILE_KV_CACHE_DTYPE='fp8'
PROFILE_REASONING_PARSER='kolibri1'
PROFILE_TOOL_CALL_PARSER='kolibri1'
PROFILE_ENABLE_AUTO_TOOL_CHOICE=1
PROFILE_NOTES='2026-10-07 VORBEREITET, nicht gemessen — Modell laedt noch (39 von 48 GB). NVFP4-Fassung von Aleph-Alpha/Kolibri-1 durch primitive-ai, Apache-2.0, compressed-tensors. Gedacht als Rueckfall, falls fp8 im Betrieb doch kippt, und als Leistungsvergleich. Grenzen absichtlich identisch zur fp8-Zeile, damit der Vergleich genau einen Unterschied hat. OFFEN: ob das Plugin NVFP4 traegt.'
