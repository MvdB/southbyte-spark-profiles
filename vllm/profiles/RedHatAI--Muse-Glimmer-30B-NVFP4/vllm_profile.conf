# vLLM Profil – RedHatAI/Muse-Glimmer-30B-NVFP4
# NVFP4 (compressed-tensors) statt BF16. Laut GB10-Rezept
# (recipes.vllm.ai/meta-models/Muse-Glimmer-30B?hardware=dgx_spark_gb10) ist auf
# 128 GB Unified Memory die NVFP4-Variante die bessere Wahl: ~22 GiB statt
# ~56 GiB Gewichte, der Rest bleibt fuer KV-Cache und Host.
#
# (Das auto-generierte Profil schaetzte die Groesse aus dem Verzeichnisnamen auf
#  ~60 GB — die Heuristik kennt nur "30B" x 2 Byte und sieht die NVFP4-Gewichte
#  nicht. Tatsaechlich sind es 22 GiB.)
#
# Gemessen 2026-08-13 an der BF16-Variante: mit 56 GiB Gewichten fiel der
# verfuegbare RAM waehrend eines parallelen Modell-Downloads unter die
# Checkpoint-Groesse, vLLM schaltete Auto-Prefetch ab und der Start dauerte
# 401 s statt 371 s. Mit 22 GiB entfaellt diese Enge.
#
# Image: dasselbe Spezial-Image wie BF16 — nur dort ist die Arch `muse_glimmer`
#   registriert. Stock-vLLM 0.26 bricht mit "Transformers does not recognize
#   this architecture" ab (am 2026-08-13 versehentlich reproduziert, als ein
#   unspezifisches --model-Pattern dieses Verzeichnis traf statt der BF16-Variante).
# KEIN explizites PROFILE_QUANTIZATION: vLLM liest quant_method und die
#   ignore-Liste aus der config.json. Lehre aus den Ling-3.0-Versuchen.
# ENFORCE_EAGER=0: die BF16-Variante lief sauber, daher direkt mit CUDA-Graphs
#   messen (BF16 lief eager bei nur ~4 tok/s). Bei Instabilitaet auf 1 setzen.
# Aufrufe mit max_tokens >= 1024: das Modell denkt vor jeder Antwort ~380
#   Tokens, sonst kommt content=null bei finish_reason=length.

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:muse-glimmer'
PROFILE_BASH_WRAPPER=0
PROFILE_DTYPE='bfloat16'
PROFILE_QUANTIZATION=''
PROFILE_GPU_MEM_UTIL='0.85'
PROFILE_MAX_MODEL_LEN=32768
PROFILE_MAX_NUM_SEQS=4
PROFILE_MAX_NUM_BATCHED_TOKENS=4096
PROFILE_ENFORCE_EAGER=0
PROFILE_TRUST_REMOTE_CODE=1
PROFILE_KV_CACHE_DTYPE='fp8'
PROFILE_TOOL_CALL_PARSER='muse_glimmer'
PROFILE_REASONING_PARSER='muse_glimmer'
PROFILE_ENABLE_AUTO_TOOL_CHOICE=1
PROFILE_VLLM_EXTRA_ARGS=('--generation-config' 'auto' '--limit-mm-per-prompt' '{"image":0}')
PROFILE_NOTES='NVFP4 (compressed-tensors), ~22 GiB. Spezial-Image vllm/vllm-openai:muse-glimmer (registriert muse_glimmer-Arch, arm64 bestaetigt). Parser muse_glimmer fuer tool+reasoning, --generation-config auto, TP=1, image:0 (Text-Eval). Quantisierung per Autodetektion aus config.json. Aufrufe mit max_tokens >=1024.'
