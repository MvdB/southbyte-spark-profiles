# vLLM Profil – poolside--Laguna-XS-2.1-FP8
#
# 2026-08-21 angelegt. Das Modell lag seit dem 12.08. gesynct auf der Platte,
# ohne Testplaneintrag und ohne gepflegtes Profil — gefunden von
# pruefe_modellbestand.py. Noch NICHT gelaufen; Werte am ersten Start gegen
# 'docker logs vllm-server' pruefen.
#
# Architektur LagunaForCausalLM ist in vLLM 0.27.1 registriert — direkt an der
# Modellregistrierung des Images geprueft, nicht aus der Doku geschlossen.
# REZEPT: recipes.vllm.ai/poolside/Laguna-S-2.1 — dieselbe Familie. Von dort
# --trust-remote-code und die Parser poolside_v1.
#
# Kontext auf 32768 statt der nativen 262144. Der Testplan misst keine
# Kontextlaenge; ein groesserer Wert kostet nur KV-Cache und macht die Zeile
# gegenueber der Kohorte unvergleichbar.
# ENFORCE_EAGER=1 fuer den ersten Start, wie bei jedem neuen MoE hier. Laeuft
# er sauber, auf 0 setzen und neu messen.
#
# 33 GB, 40 Schichten, 256 Experten, 8 aktiv, FP8.

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:v0.27.1'
PROFILE_BASH_WRAPPER=0
PROFILE_DTYPE='bfloat16'
PROFILE_GPU_MEM_UTIL='0.85'
PROFILE_MAX_MODEL_LEN=32768
PROFILE_MAX_NUM_SEQS=4
PROFILE_MAX_NUM_BATCHED_TOKENS=4096
PROFILE_ENFORCE_EAGER=1
PROFILE_TRUST_REMOTE_CODE=1
PROFILE_KV_CACHE_DTYPE='fp8'
# 2026-08-23: OHNE diese Zeile startet das Modell auf dieser Maschine NICHT.
# DeepGEMM bricht beim Nachbearbeiten der blockweisen FP8-Skalen ab:
#   RuntimeError: Assertion error (deepgemm/csrc/apis/layout.hpp:60):
#                 Unknown SF transformation
# Es kennt die Layout-Umformung fuer block_structure 128x128 auf sm_120 nicht.
# Ohne DeepGEMM nimmt vLLM einen Pfad, der sie kennt. Laguna-S ist nicht
# betroffen, weil NVFP4 diesen Code gar nicht anfaesst.
PROFILE_DOCKER_ENV='VLLM_USE_DEEP_GEMM=0'
PROFILE_TOOL_CALL_PARSER='poolside_v1'
PROFILE_ENABLE_AUTO_TOOL_CHOICE=1
PROFILE_REASONING_PARSER='poolside_v1'
PROFILE_VLLM_EXTRA_ARGS=()
PROFILE_NOTES='2026-08-21 angelegt. 2026-08-22 zweimal am Start gescheitert (Engine core init), 2026-08-23 mit VLLM_USE_DEEP_GEMM=0 nach 271 s bereit; vollstaendig gemessen: 54 Prozent (53/98), 21 K.O., 37,4 tok/s, TTFT 65 ms, 0 Fehlfaelle. Acht Punkte schwaecher in der Qualitaet als der grosse Bruder Laguna-S (41,9 gegen 58 Prozent), aber mehr als doppelt so schnell und in Bias, Sicherheit und Code besser. Anders als Laguna-S bleibt KEIN verwaistes </think> in den Antworten stehen. 33 GB, 40 Schichten, 256 Experten, 8 aktiv, compressed-tensors FP8. Kleine Schwester von Laguna-S.'
