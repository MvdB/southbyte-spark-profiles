# vLLM Profil – RedHatAI/Qwen3.8-27B-NVFP4
#
# Gespiegelt am 21.08.2026 aus ~/hf_models. Das Profil hatte zwei Testplan-
# laeufe getragen, ohne je hier zu liegen — die Zeilen auf der Ergebnisseite
# waren damit nicht reproduzierbar. Das holt diese Datei nach.
#
# KEIN REZEPT FUER GB10. recipes.vllm.ai fuehrt Qwen3.8-27B, aber nur mit
# Abschnitten fuer andere Hardware. Die Werte stammen aus dem 1x-RTX-5090-
# Abschnitt (ebenfalls Blackwell, sm120), mit zwei bewussten Abweichungen:
# --enforce-eager und Kontext 32768 sind dort Beschraenkungen der 32-GB-Karte.
# Auf dem Spark startet das Modell mit CUDA-Graphs und 131072 sauber.
# Kontext und Batchgroessen sind vom FP8-Profil uebernommen, damit die beiden
# Kohortenzeilen vergleichbar bleiben.
#
# Gegen die FP8-Fassung: 21 statt 29 GiB, weil dieser Checkpoint textonly ist.
# Gleiche Architektur (Qwen3_5ForConditionalGeneration, 64 Schichten).
#
# GEMESSEN (Performance-Playbook, je 50 Anfragen):
#
#                          FP8      NVFP4    NVFP4+MTP
#     Durchsatz Median      7,9      11,2       22,6   tok/s
#     TTFT p50              181       166        283   ms
#     Pass-Rate              73        72         73
#     K.O.                    9        13         16
#
# MTP-KOPF STECKT IM CHECKPOINT (model_mtp.safetensors), es braucht keinen
# eigenen Drafter. Er verdoppelt den Durchsatz und kostet 117 ms TTFT. Der
# Kopf liegt uebrigens auch in der FP8-Fassung (mtp_num_hidden_layers=1),
# genutzt wurde er dort nie.
#
# Eingeschaltet wird er NICHT hier, sondern am Testplaneintrag
# Qwen3.8-27B-NVFP4-MTP ueber vllm_extra_args — zwei Eintraege auf diesem
# einen Profil, die sich nur im Serving unterscheiden:
#   --speculative-config {"method":"mtp","num_speculative_tokens":3}
# Drei Spekulationstoken laut Rezept. Keine Leerzeichen im JSON: der Runner
# zerlegt seine Argumente an Leerzeichen.
#
# Veroeffentlichte Akzeptanzraten gelten fuer ANDERE Builds (unsloth 0,788,
# Inferact 0,897, 1x5090 0,754). Der RedHatAI-Checkpoint ist dort nicht
# gemessen; die 2,02x hier sind der eigene Messwert.
#
# KEIN explizites PROFILE_QUANTIZATION: vLLM liest quant_method und die
# ignore-Liste aus der config.json. Lehre aus den Ling-3.0-Versuchen.

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:v0.27.1'
PROFILE_BASH_WRAPPER=0
PROFILE_DTYPE='bfloat16'
PROFILE_GPU_MEM_UTIL='0.85'
PROFILE_MAX_MODEL_LEN=131072
PROFILE_MAX_NUM_SEQS=4
PROFILE_MAX_NUM_BATCHED_TOKENS=4096
PROFILE_ENFORCE_EAGER=0
PROFILE_TRUST_REMOTE_CODE=0
PROFILE_KV_CACHE_DTYPE='fp8'
PROFILE_VLLM_EXTRA_ARGS=('--reasoning-parser' 'qwen3')
PROFILE_NOTES='2026-08-21 gespiegelt, zwei Laeufe getragen (19./20.08.). NVFP4 21 GiB gegen 29 GiB FP8, textonly, Start 6 min 5 s. Durchsatz 11,2 tok/s gegen 7,9 der FP8-Fassung; mit dem MTP-Kopf 22,6 tok/s bei 283 ms TTFT. MTP wird am Testplaneintrag eingeschaltet, nicht hier. Werte aus dem 5090-Rezept, da es fuer GB10 keins gibt; Kontext und Batchgroessen aus dem FP8-Profil, damit die Kohortenzeilen vergleichbar bleiben.'
