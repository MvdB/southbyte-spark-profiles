# vLLM Profil – nvidia/Llama-4-Scout-17B-16E-Instruct-NVFP4
# Llama4ForConditionalGeneration (model_type llama4), MoE mit 16 Experten,
# davon 1 aktiv pro Token. 109B gesamt / 17B aktiv. NVFP4 (modelopt),
# KV-Cache-Schema FP8. Gewichte ~61 GiB auf der Platte.
#
# ACHTUNG - das auto-generierte Profil war gefaehrlich falsch:
#   Die Heuristik in vllm_spark_profiler.py liest "17B" aus dem Namen und
#   rechnet 17 x 0.5 Byte = ~8 GB. Tatsaechlich sind es 61 GiB, weil die 16
#   Experten mitzaehlen (17B ist die AKTIVE, nicht die Gesamtgroesse).
#   Aus den falschen 8 GB folgte ein KV-Budget von ~95 GB und
#   max_model_len=131072 - das haette beim Start OOM gegeben.
#
# max_model_len: die config.json nennt max_position_embeddings=10485760 (10M).
#   Hier bewusst auf 32768 begrenzt (Eval-Kontext). KV-Bedarf bei fp8:
#   48 Layer x 2 x 8 KV-Heads x 128 head_dim x 1 Byte = 96 KiB/Token
#   -> 32768 x 4 Sequenzen = 12.6 GiB KV. Zusammen mit 61 GiB Gewichten
#   passt das in die ~121 GiB nutzbaren Speicher.
#
# NVFP4 auf sm_120: modelopt-NVFP4 ist der bekannt heikle Pfad (siehe
#   KNOWN_GOOD in vllm_spark_profiler.py - FLASHINFER_CUTLASS hat keine
#   sm_120-Tactic, MARLIN lieferte bei gemischtem NVFP4/FP8 NaN-Logits).
#   Die Env-Kombination unten ist von
#   nvidia--NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4 uebernommen, dem hier
#   einzigen validierten modelopt-NVFP4-Modell.
# Vision: Scout ist multimodal (vision_config vorhanden, im Checkpoint von der
#   Quantisierung ausgenommen). Wir testen Text -> limit-mm image:0 spart den
#   Multimodal-Profiling-Overhead beim Start.
#
# STATUS 2026-08-13: VALIDIERT. Start 191 s, TTFT 0.15-0.23 s, 19.2 tok/s
#   (3 Laeufe). Faktencheck bei temperature 0 sauber: Tokio, 2+2=4,
#   'schwarz, rot und gold'; deutsche Rhein-Erklaerung korrekt.
#   Die Marlin-Env von Nemotron-3-Super traegt also auch fuer modelopt-NVFP4
#   auf Llama-4 - das war der Hauptunsicherheitsfaktor.

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:v0.27.1'
PROFILE_BASH_WRAPPER=0
PROFILE_DTYPE='bfloat16'
PROFILE_QUANTIZATION=''
PROFILE_GPU_MEM_UTIL='0.85'
PROFILE_MAX_MODEL_LEN=32768
PROFILE_MAX_NUM_SEQS=4
PROFILE_MAX_NUM_BATCHED_TOKENS=4096
PROFILE_ENFORCE_EAGER=0
PROFILE_TRUST_REMOTE_CODE=1
PROFILE_KV_CACHE_DTYPE='fp8'
PROFILE_ATTENTION_BACKEND='TRITON_ATTN'
PROFILE_DOCKER_ENV='VLLM_NVFP4_GEMM_BACKEND=marlin VLLM_USE_FLASHINFER_MOE_FP4=0 VLLM_TEST_FORCE_FP8_MARLIN=1 VLLM_ENGINE_CORE_STARTUP_TIMEOUT=600'
PROFILE_VLLM_EXTRA_ARGS=('--limit-mm-per-prompt' '{"image":0}')
PROFILE_NOTES='Llama-4-Scout 17B-16E NVFP4 (modelopt), 109B gesamt / 17B aktiv, ~61 GiB. max_model_len bewusst auf 32768 statt der 10M aus der config.json. Marlin-Env von Nemotron-3-Super-NVFP4 uebernommen (FLASHINFER_CUTLASS crasht auf sm_120). Text-Eval: image:0. Das auto-generierte Profil schaetzte 8 GB statt 61 GiB und haette OOM verursacht. Validiert 2026-08-13: Start 191 s, TTFT 0.15-0.23 s, 19.2 tok/s.'
