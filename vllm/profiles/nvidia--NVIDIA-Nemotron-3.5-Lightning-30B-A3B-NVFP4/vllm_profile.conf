# vLLM Profil – nvidia--NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
#
# 2026-09-12: auf das GB10-Rezept von recipes.vllm.ai umgestellt
# (/nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4/hw/dgx_spark_gb10.json).
# Die Fassung vom 12.08. entstand vor dem Sync und wich an sechs Stellen ab —
# am folgenreichsten beim Tool-Parser: das Rezept nennt qwen3_xml, nicht
# qwen3_coder. Ein falscher Parser bricht die Tool-Faelle des Testplans still.
#
# Einzige bewusste Abweichung vom Rezept: das Image. Das GB10-Rezept nennt den
# beweglichen Tag "nightly"; hier steht v0.27.1. Gruende: die Modellkarte nennt
# v0.27.1, das Rezept fuehrt 0.27.1 als Mindestversion, die Kohorte laeuft auf
# 0.27.1, und ein Nightly ist nicht reproduzierbar. Alle Rezept-Flags existieren
# in v0.27.1 (geprueft ueber EngineArgs: moe_backend, mamba_backend,
# mamba_cache_mode, mamba_ssm_cache_dtype, enable_mamba_cache_stochastic_rounding,
# mamba_cache_philox_rounds). Scheitert der Start, ist nightly der Rueckweg.
#
# VALIDIERT auf DGX Spark (GB10, sm_121) am 12./13.09.2026:
#   Smoke-Test, 6 Anfragen, 0 Fehler:
#     - Deutsch + Reasoning: korrekte Antwort, Denkspur getrennt (reasoning_content)
#     - Tool-Call: qwen3_xml liefert strukturiertes tool_calls, Umlaut und Enum korrekt
#     - max_tokens 256: Antwort kommt an (anders als Nemotron-3-Super, das bei
#       knappem Budget leer zurueckkommen kann)
#     - Einzelstrom 82 tok/s, TTFT 110-140 ms (Super: 15,9 tok/s)
#   Im Container-Log belegt, nicht nur angefordert: Marlin fuer FP4
#   (weight-only), FlashInfer-Mamba-SSU, KV fp8, fastsafetensors (52 Shards in
#   6 s). Start bis bereit: ~140 s. Speicher bei gpu 0.7: 84 GB belegt.
#   Voller Testplan (--continue-after-ko): alle 6 Playbooks in 63 min,
#   0 technische Fehler; 06_performance 80,3 tok/s, TTFT 68 ms.
#   Beobachtet: think-001 (Flussueberquerungsraetsel, 3 Woelfe und 3 Schafe)
#   laeuft REPRODUZIERBAR in eine Reasoning-Schleife bis max_tokens (32768) ohne
#   Content — in beiden Laeufen; loc-bay-014 tat es nur in einem. Kostet je Fall
#   ~6,6 min und zaehlt als nicht bestanden. Modelleigenschaft, keine Einstellung.
#
# Modell: Mamba-2/MoE-Hybrid mit einzelnen Attention-Lagen, 30B gesamt / 3B aktiv,
# 128 Experten mit 6 aktiven, 2 KV-Koepfe. NVFP4 (W4A16 auf Experten). Gewichte
# 21 GB. MTP-Lage im Checkpoint (num_nextn_predict_layers=1); DSpark/DFlash
# braeuchten separate Drafter — fuer die Evaluation Basis-Serving ohne Spekulation.

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:v0.27.1'
PROFILE_DTYPE='bfloat16'
PROFILE_GPU_MEM_UTIL='0.7'              # Rezept GB10
PROFILE_MAX_MODEL_LEN=262144            # Rezept: Standard 256K (nativ 1M)
PROFILE_MAX_NUM_SEQS=4                  # Testplan-Parallelitaet; Rezept setzt fuer GB10 nichts
PROFILE_MAX_NUM_BATCHED_TOKENS=16384    # Rezept GB10
PROFILE_ENFORCE_EAGER=0                 # Rezept erzwingt kein eager
PROFILE_TRUST_REMOTE_CODE=0
PROFILE_KV_CACHE_DTYPE='fp8'
PROFILE_LOAD_FORMAT='fastsafetensors'   # Rezept GB10
PROFILE_TOOL_CALL_PARSER='qwen3_xml'    # Rezept — NICHT qwen3_coder
PROFILE_REASONING_PARSER='nemotron_v3'
PROFILE_ENABLE_AUTO_TOOL_CHOICE=1
# Prefix-Caching setzt vllm_spark.sh selbst, sofern das Image es kann.
PROFILE_VLLM_EXTRA_ARGS=('--moe-backend' 'marlin'
  '--mamba-backend' 'flashinfer' '--mamba-cache-mode' 'align'
  '--mamba-ssm-cache-dtype' 'float16'
  '--enable-mamba-cache-stochastic-rounding' '--mamba-cache-philox-rounds' '5')
PROFILE_NOTES='2026-09-12: GB10-Rezept von recipes.vllm.ai, Image v0.27.1 statt nightly (Modellkarte, Mindestversion, Kohorte). Tool-Parser qwen3_xml. MoE marlin, Mamba flashinfer/align, KV fp8, gpu 0.7, fastsafetensors. Ohne Spekulation.'
