# vLLM Profil – nvidia--NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
# 2026-08-12 nach HF-Card + recipes.vllm.ai (recipe-first). Sync geplant 01:00; nach Sync dieses
# Profil nach ~/hf_models/nvidia--NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4/vllm_profile.conf kopieren.
#
# Modell: MoE-Hybrid (interleaved Mamba-2 + MoE + select Attention), 30B total / 3B aktiv.
# Quant: NVFP4 — W4A16 auf routed+shared Experts, FP8 per-tensor dynamic auf mamba in/out_proj + KV.
# ⚠️ BRAUCHT vLLM v0.27.1 (unser Default ist v0.26.0). GB10-Recipe: --moe-backend marlin +
# --kv-cache-dtype fp8. NVFP4 auto-detect auf sm_120 (Ampere bräuchte --quantization modelopt_fp4).
# Parser: tool qwen3_coder, reasoning nemotron_v3. Spec-Decoding (DSpark/DFlash/MTP) optional —
# bräuchte den DSpark-Drafter-Checkpoint separat (nicht gesynct); für den Eval Base-Serving.
# 30B NVFP4 ≈ ~15-18 GB → passt locker.

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:v0.27.1'   # ⚠️ arm64-Verfügbarkeit vor Lauf verifizieren (docker pull)
PROFILE_DTYPE='bfloat16'
PROFILE_GPU_MEM_UTIL='0.85'
PROFILE_MAX_MODEL_LEN=32768        # native bis 1M → 32k (Eval-Kontext, KV-Budget)
PROFILE_MAX_NUM_SEQS=4
PROFILE_ENFORCE_EAGER=1            # Mamba-Hybrid, erster Lauf konservativ (kein CUDA-Graph); ggf. lockern
PROFILE_TRUST_REMOTE_CODE=0
PROFILE_KV_CACHE_DTYPE='fp8'
PROFILE_TOOL_CALL_PARSER='qwen3_coder'
PROFILE_REASONING_PARSER='nemotron_v3'
PROFILE_ENABLE_AUTO_TOOL_CHOICE=1
PROFILE_VLLM_EXTRA_ARGS=('--moe-backend' 'marlin')
PROFILE_NOTES='2026-08-12 Rezept: vLLM v0.27.1-Image, --moe-backend marlin, kv fp8, NVFP4 auto (sm_120). Parser qwen3_coder (tool) + nemotron_v3 (reasoning). MoE-Hybrid Mamba+Transformer 30B/3B. Sync 01:00, dann Profil nach ~/hf_models kopieren + testen. Bei Mamba-Startup-Zicken: --mamba-backend flashinfer (H100-Recipe) probieren. Spec-Decoding optional (DSpark-Drafter separat).'
