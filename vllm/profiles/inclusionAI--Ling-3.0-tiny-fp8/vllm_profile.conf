# vLLM Profil – inclusionAI/Ling-3.0-tiny-fp8
# STAND 2026-08-13: NICHT NUTZBAR. Das Modell laedt und antwortet fluessig,
# liefert aber sachlich falsche Ergebnisse (stiller Fehler, kein Absturz).
# Deshalb COMPATIBLE=0 - eine Evaluation damit waere wertlos und irrefuehrend.
# BailingMoeV3 (model_type bailing_hybrid): Hybrid aus KDA-Linear-Attention und
# Gated MLA, 24 Layer, 128 Experten (8 aktiv + 1 shared), FP8 blockweise 128x128.
#
# Image: BailingMoeV3ForCausalLM ist erst NACH v0.27.1 in vLLM gelandet
#   (vllm/model_executor/models/bailing_moe_v3.py auf main, Registry-Eintrag
#   "BailingMoeV3ForCausalLM"). Deshalb pinned Nightly statt DEFAULT_VLLM_TAG.
#   Der Fork inclusionAI/vllm-ling-v3 (Branch ling_3_0) aus der Modellkarte
#   ist damit nicht noetig.
# VLLM_USE_DEEP_GEMM=0: DeepGEMM kennt sm_120/GB10 nicht ("Unknown recipe" in
#   layout.hpp) — genau der Pfad, den blockweises FP8 (128x128) sonst nimmt.
#   Gleiche Massnahme wie bei Qwen3.6-35B-A3B-FP8.
# --mamba-cache-mode align: aus der Modellkarte (KDA-State-Cache). MRV2 ist
#   damit inkompatibel -> PROFILE_USE_V2_MODEL_RUNNER=0 (Praezedenz: Qwen3.6-35B).
# Kontext: 131072 nativ. Die Heuristik in vllm_spark_profiler.py rechnet mit
#   MHA/GQA (~98 KB/Token) und wuerde grob unterschaetzen — MLA (kv_lora_rank
#   512) braucht ein Vielfaches weniger, KDA-Layer haben konstanten State.
#   Darum hier explizit gesetzt.

PROFILE_VLLM_COMPATIBLE=0
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:nightly-3d204dfdaaf09d67d49c7855630ef949754e0f8f'
PROFILE_BASH_WRAPPER=0
PROFILE_DTYPE='bfloat16'
# 2026-08-13: KEIN explizites --quantization! Mit PROFILE_QUANTIZATION='fp8'
#   baut vLLM die Fp8Config aus der CLI (Log: quantization=fp8,
#   quantization_config=None) und verliert dabei modules_to_not_convert aus
#   der config.json - 15 Ausnahmen, darunter 6 layer-spezifische KDA-Module
#   (3./7./11./15./19./23.attention.g_proj) und die MLA-Projektionen.
#   Die werden dann mitquantisiert -> kein Absturz, aber falsche Zahlen.
#   Autodetektion aus der config.json haelt die Ausnahmeliste.
PROFILE_QUANTIZATION=''
PROFILE_TRUST_REMOTE_CODE=1
PROFILE_GPU_MEM_UTIL='0.85'
PROFILE_MAX_MODEL_LEN=131072
PROFILE_MAX_NUM_SEQS=4
PROFILE_MAX_NUM_BATCHED_TOKENS=4096
PROFILE_ENFORCE_EAGER=0
PROFILE_KV_CACHE_DTYPE=''
PROFILE_ENABLE_AUTO_TOOL_CHOICE=1
PROFILE_TOOL_CALL_PARSER='ling3'
PROFILE_REASONING_PARSER='ling3'
PROFILE_USE_V2_MODEL_RUNNER=0
# 2026-08-13 Versuch 1 GESCHEITERT: mit VLLM_USE_DEEP_GEMM=0 waehlt vLLM
#   CutlassFp8BlockScaledMMKernel -> RuntimeError: cutlass_gemm_caller ...
#   Invalid status (sm_120). Der Checkpoint hat scale_fmt=ue8m0, das ist das
#   DeepGEMM-Format - die Sperre erzwang also genau den kaputten Fallback.
#   Versuch 2: DeepGEMM zulassen (Env leer).
# 2026-08-13 Versuch 2 GESCHEITERT (silent): DeepGEMM startet sauber, rechnet aber
#   falsch. Bei temperature=0 ueber /v1/completions: '2 + 2 = 2, then 2 + 1 = 3';
#   'Farben der deutschen Flagge: Schwarz, Rot, Gelb, Gruen'. Kein Absturz, keine
#   NaN - nur falsche Zahlen. Versuch 3: Marlin fuer Linear + MoE erzwingen.
# 2026-08-13 Versuch 3 GESCHEITERT: --moe-backend marlin greift, aber
#   VLLM_TEST_FORCE_FP8_MARLIN=1 bewegt den LINEAR-Pfad nicht (weiter
#   DeepGemmFp8BlockScaledMMKernel). Ausgabe unveraendert falsch:
#   '2 + 2 = 20 in base 10', '17 mal 23 ergibt 533', Flagge 'blau/weiss'.
#   Versuch 4: Triton fuer BEIDE Pfade (--linear-backend/--moe-backend).
PROFILE_DOCKER_ENV=''
# 2026-08-13 Versuch 4 GESCHEITERT: Triton fuer Linear UND MoE, Ausgabe weiter
#   falsch ('2 + 2 = 3', Flagge 'blau/schwarz/gold'). Damit sind CUTLASS,
#   DeepGEMM, Marlin und Triton durch - der Kernel-Pfad ist entlastet.
PROFILE_VLLM_EXTRA_ARGS=('--mamba-cache-mode' 'align')
PROFILE_NOTES='Ling-3.0-tiny-fp8: startet, rechnet aber FALSCH. 5 Konfigurationen getestet (CUTLASS=Absturz; DeepGEMM, Marlin-MoE, Triton Linear+MoE, ohne --quantization = jeweils falsche Ausgabe). Bei temperature 0: "2 + 2 = 3", Flagge "blau/schwarz/gold", 17*23 = 533. Kernel-Pfad damit entlastet - Verdacht auf die frische bailing_moe_v3/KDA-Implementierung upstream. NICHT fuer Evaluationen verwenden.'
