# vLLM Profil – NVIDIA-Nemotron-3.5-Bolt-E4B-BF16
# HF-ID   : nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-BF16
#
# Kein Rezept auf recipes.vllm.ai (Stand 24.10.2026, weder unter nvidia noch mit
# hardware=dgx_spark_gb10). Quelle ist die Modellkarte, Abschnitt „Run it with
# vLLM“ (vLLM v0.31.0). Abschrift der Karte: dtype bfloat16, max-model-len 65536,
# max-num-seqs 64, max-num-batched-tokens 65536, kv-cache-dtype auto, Parser
# gemma4 fuer Werkzeuge und Denken, Vorlage aus dem Modellordner, keine Bild-,
# Video- oder Audioeingabe.
#
# Einzige Abweichung: GPU_MEM_UTIL 0.50 statt 0.85. Die Karte rechnet mit einer
# eigenen GPU; auf dem GB10 teilen sich alle Prozesse 128 GB, und 0.85 hiesse
# 103 GiB. Gebraucht werden ~16 GB Gewichte plus KV-Cache: nur 7 der 42 Schichten
# halten den vollen Kontext, eine Sequenz mit 65536 Token kostet rund 1 GB.
#
# Spekulation (DFlash) gehoert nicht ins Profil, sondern als vllm_extra_args in
# die Testplan-Zeile, wie bei Muse-Glimmer: Drafter
# nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-BF16-DFlash-NVFP4, 7 Spekulationstoken
# laut Karte.

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:v0.31.0'
PROFILE_BASH_WRAPPER=0
PROFILE_DTYPE='bfloat16'
PROFILE_QUANTIZATION=''
PROFILE_GPU_MEM_UTIL='0.50'
PROFILE_MAX_MODEL_LEN=65536
PROFILE_MAX_NUM_SEQS=64
PROFILE_MAX_NUM_BATCHED_TOKENS=65536
PROFILE_ENFORCE_EAGER=0
PROFILE_KV_CACHE_DTYPE='auto'
PROFILE_CHAT_TEMPLATE='/hf_models/nvidia--NVIDIA-Nemotron-3.5-Bolt-E4B-BF16/chat_template.jinja'
PROFILE_TOOL_CALL_PARSER='gemma4'
PROFILE_REASONING_PARSER='gemma4'
PROFILE_ENABLE_AUTO_TOOL_CHOICE=1
PROFILE_VLLM_EXTRA_ARGS=(
  '--limit-mm-per-prompt'   '{"image":0,"video":0,"audio":0}'
)
PROFILE_NOTES='2026-10-24 angelegt nach Modellkarte (kein Rezept). Gemma-4-E4B, von NVIDIA nachtrainiert; 8B Parameter, 4B wirksam, BF16. Abweichung von der Karte nur GPU_MEM_UTIL 0.50 statt 0.85 (geteilter Speicher). Denken per Vorlage, Werkseinstellung aus (enable_thinking=false). Sampling laut Karte temperature 1.0, top_p 0.95 — steht im Testplan. Lizenz OpenMDW-1.1.'
