# vLLM Profil – nvidia/Llama-3.3-70B-Instruct-NVFP4
# LlamaForCausalLM, dicht (kein MoE), 80 Layer, 8 KV-Heads, head_dim 128.
# NVFP4 (modelopt, group_size 16), KV-Cache-Schema FP8, lm_head ausgenommen.
# Gewichte ~40 GiB auf der Platte.
#
# Das auto-generierte Profil lag doppelt daneben:
#   Es schaetzte 140 GB (70B x 2 Byte - las die NVFP4-Quantisierung nicht),
#   daraus folgte ein KV-Budget von nur ~4 GB und max_model_len=8192 bei
#   2 Sequenzen. Tatsaechlich sind es 40 GiB, es ist also deutlich mehr Platz.
#
# KV-Bedarf bei fp8: 80 Layer x 2 x 8 KV-Heads x 128 head_dim x 1 Byte
#   = 160 KiB/Token. Bei 32768 Kontext x 4 Sequenzen = 20 GiB.
#   40 GiB Gewichte + 20 GiB KV = 60 GiB, passt komfortabel in ~121 GiB.
#   Nativ koennte das Modell 131072 - fuer die Evaluation reichen 32768,
#   und der Puffer haelt den Start robust.
#
# NVFP4 auf sm_120: gleiche Marlin-Env wie bei Llama-4-Scout und
#   Nemotron-3-Super-NVFP4. FLASHINFER_CUTLASS hat auf GB10 keine Tactic.
#   Bei Scout hat diese Kombination am 2026-08-13 nachweislich funktioniert
#   (19.2 tok/s, Faktencheck sauber).
#
# Erwartete Groessenordnung: das Modell ist speicherbandbreitenlimitiert,
#   273 GB/s / 40 GiB ~ 6.8 tok/s theoretisch.
#
# STATUS 2026-08-13: Profil geschrieben, Erststart steht noch aus.

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:v0.27.1'
PROFILE_BASH_WRAPPER=0
PROFILE_DTYPE='bfloat16'
PROFILE_QUANTIZATION=''
PROFILE_GPU_MEM_UTIL='0.85'
PROFILE_MAX_MODEL_LEN=32768
PROFILE_MAX_NUM_SEQS=4
PROFILE_MAX_NUM_BATCHED_TOKENS=4096
PROFILE_ENFORCE_EAGER=0
PROFILE_TRUST_REMOTE_CODE=1
PROFILE_KV_CACHE_DTYPE='fp8'
PROFILE_ATTENTION_BACKEND='TRITON_ATTN'
PROFILE_DOCKER_ENV='VLLM_NVFP4_GEMM_BACKEND=marlin VLLM_USE_FLASHINFER_MOE_FP4=0 VLLM_TEST_FORCE_FP8_MARLIN=1 VLLM_ENGINE_CORE_STARTUP_TIMEOUT=600'
PROFILE_NOTES='Llama-3.3-70B-Instruct NVFP4 (modelopt), dicht, ~40 GiB. max_model_len 32768 (nativ 131072), KV fp8 = 160 KiB/Token. Marlin-Env wie Scout/Nemotron-3-Super, da FLASHINFER_CUTLASS auf sm_120 keine Tactic hat. Auto-Profil schaetzte 140 GB und begrenzte den Kontext auf 8192 - beides falsch.'
