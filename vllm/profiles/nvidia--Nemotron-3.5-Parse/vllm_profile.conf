# vLLM Profil – nvidia/Nemotron-3.5-Parse (Vision-Dimension, OCR-Bezugsgröße)
#
# Dokument-Parser (RadioMBartPrefixForCausalLM, ~0,9B), Lizenz OpenMDW-1.1 (Tokenizer
# MIT). Kein Rezept auf recipes.vllm.ai. Werte nach Karte und dem Parse-Dienst in
# SB-FIND, der genau so seit Wochen läuft: eigenes Image (vllm/custom/
# Dockerfile.nemotron-parse, vLLM v0.26.0 + Paket nemotron-parse aus dem Modellordner),
# uni-Executor, kein Prefix-Caching, ein Bild je Anfrage, eigenes chat_template.jinja.
#
# KEIN --chat-template-content-format openai: Das Template gibt message['content']
# direkt aus; vLLM erkennt das selbst als string. Die Aufgabe ist ein fester Prompt
# aus Kontrolltoken (Testplan-Feld vision_prompt), Antwort mit Rahmen- und
# Klassenmarken (vision_ausgabe: parse).
PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='spark-nemotron-parse:v1'
PROFILE_DTYPE='bfloat16'
PROFILE_TRUST_REMOTE_CODE=1
PROFILE_GPU_MEM_UTIL='0.10'
PROFILE_MAX_MODEL_LEN=16384
PROFILE_MAX_NUM_SEQS=16
PROFILE_MAX_NUM_BATCHED_TOKENS=16384
# fp8-KV wie in den übrigen Profilen hat Parse in SB-FIND nie gesehen; dort läuft bf16.
PROFILE_KV_CACHE_DTYPE='auto'
PROFILE_IPC_HOST=1
PROFILE_CHAT_TEMPLATE='/hf_models/nvidia--Nemotron-3.5-Parse/chat_template.jinja'
PROFILE_VLLM_EXTRA_ARGS=(
  '--distributed-executor-backend' 'uni'
  '--no-enable-prefix-caching'
  '--limit-mm-per-prompt' '{"image":1}'
)
PROFILE_NOTES='2026-10-25 angelegt für die Vision-Dimension (OCR-Bezugsgröße). Image spark-nemotron-parse:v1. Lizenz OpenMDW-1.1.'
