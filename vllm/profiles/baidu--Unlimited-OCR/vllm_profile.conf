# vLLM Profil – baidu/Unlimited-OCR (Vision-Dimension, OCR-Bezugsgröße)
#
# Dokument-Parser aus der DeepSeek-OCR-Linie (UnlimitedOCRForCausalLM, ~3B), MIT.
# REZEPT recipes.vllm.ai/baidu/Unlimited-OCR (YAML models/baidu/Unlimited-OCR.yaml):
# eigenes Image vllm/vllm-openai:unlimited-ocr (arm64/cu130 vorhanden, hier mit einem
# Registry-Alias als spark-unlimited-ocr:v1), Pflicht ist der
# No-Repeat-N-Gram-Logits-Prozessor, Prefix-Caching und mm-Cache aus. Je Anfrage
# skip_special_tokens=false und vllm_xargs ngram_size=35/window_size=128 (extra_body),
# gierig. Antwort Markdown mit <|ref|>/<|det|>-Marken (vision_ausgabe: unlimited_ocr).
#
# Abweichung vom Rezept, beide Folgen des Repo-Updates vom 2026-10-14:
# - Das Repo bringt jetzt ein chat_template.jinja mit, das für den Bildteil selbst
#   "<image>" voranstellt. Die Aufgabe heißt deshalb "document parsing." OHNE das
#   "<image>" des Rezepts (vision_prompt); mit ihm stünden zwei Bildmarken im Prompt,
#   die Antwort war leer (Probe 25.10.).
# - transformers 5.12 im Image baut aus tokenizer_class LlamaTokenizerFast einen
#   Tokenizer ohne ByteLevel-Decoder; vLLM gibt die Token roh aus (Ġ, Ċ, Ã¶). Der
#   Evaluator dreht das zurück (evaluators/vision.py, _byte_level_zurueck).
PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='spark-unlimited-ocr:v1'
PROFILE_DTYPE='bfloat16'
PROFILE_TRUST_REMOTE_CODE=1
PROFILE_GPU_MEM_UTIL='0.15'
PROFILE_MAX_MODEL_LEN=16384
PROFILE_MAX_NUM_SEQS=8
PROFILE_KV_CACHE_DTYPE='auto'
PROFILE_IPC_HOST=1
# Das Modell-Repo hat am 2026-10-14 model_type von "unlimited-ocr" auf "unlimited_ocr"
# umbenannt. Das Rezept-Image kennt nur den alten Namen; spark-unlimited-ocr:v1
# (vllm/custom/Dockerfile.unlimited-ocr) trägt den neuen als zweiten Schlüssel in
# vLLMs Konfigurations-Registry ein. hf-overrides model_type reichte nicht: die Engine
# lädt die Konfiguration für den Tokenizer ohne Overrides neu.
PROFILE_VLLM_EXTRA_ARGS=(
  '--logits_processors' 'vllm.model_executor.models.unlimited_ocr:NGramPerReqLogitsProcessor'
  '--no-enable-prefix-caching'
  '--mm-processor-cache-gb' '0'
  '--limit-mm-per-prompt' '{"image":1}'
)
PROFILE_NOTES='2026-10-25 angelegt für die Vision-Dimension (OCR-Bezugsgröße) nach Rezept. Lizenz MIT.'
