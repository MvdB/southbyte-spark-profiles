# vLLM Profil – poolside--Laguna-S-2.1-NVFP4
#
# 2026-08-21 angelegt. Das Modell lag seit dem 12.08. gesynct auf der Platte,
# ohne Testplaneintrag und ohne gepflegtes Profil — gefunden von
# pruefe_modellbestand.py. Noch NICHT gelaufen; Werte am ersten Start gegen
# 'docker logs vllm-server' pruefen.
#
# Architektur LagunaForCausalLM ist in vLLM 0.27.1 registriert — direkt an der
# Modellregistrierung des Images geprueft, nicht aus der Doku geschlossen.
# REZEPT: recipes.vllm.ai/poolside/Laguna-S-2.1 — ausdruecklich auf DGX Spark
# (GB10) mit vLLM 0.25.1 validiert. Von dort --trust-remote-code und die
# Parser poolside_v1; beide liegen im Image (reasoning/__init__.py und
# tool_parsers/__init__.py). Das Rezept nennt max-model-len 262144, hier
# bewusst 32768 (siehe unten).
#
# Kontext auf 32768 statt der nativen 1048576. Der Testplan misst keine
# Kontextlaenge; ein groesserer Wert kostet nur KV-Cache und macht die Zeile
# gegenueber der Kohorte unvergleichbar.
# ENFORCE_EAGER=1 fuer den ersten Start, wie bei jedem neuen MoE hier. Laeuft
# er sauber, auf 0 setzen und neu messen.
#
# SPEICHER: 92,9 GiB Gewichte auf 128 GB Unified Memory — das groesste Modell
# in der Kohorte. Der Vergleich, der die Werte hier begruendet:
#
#                                Budget    Gewichte   bleibt fuer KV
#   Nemotron-3-Super bei 0.92    117,8       74,8        ~43 GiB
#   Laguna-S bei 0.90            115,2       92,9        ~22 GiB
#
# Der Super laeuft auf dieser Maschine seit Monaten mit 0.92. 0.90 ist also
# nicht waghalsig, sondern eine Kleinigkeit konservativer als das, was
# nachweislich traegt. Eine erste Fassung dieses Profils stand auf 0.80 — das
# haette nur ~9,5 GiB KV-Cache gelassen und genau den Fehlstart provoziert,
# gegen den die Vorsicht gedacht war.
#
# Reisst der Start trotzdem: MAX_MODEL_LEN senken, nicht GPU_MEM_UTIL heben.
# 48 Schichten, 256 Experten, 10 aktiv.

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:v0.27.1'
PROFILE_BASH_WRAPPER=0
PROFILE_DTYPE='bfloat16'
PROFILE_GPU_MEM_UTIL='0.90'
PROFILE_MAX_MODEL_LEN=32768
PROFILE_MAX_NUM_SEQS=2
PROFILE_MAX_NUM_BATCHED_TOKENS=4096
PROFILE_ENFORCE_EAGER=1
PROFILE_TRUST_REMOTE_CODE=1
PROFILE_KV_CACHE_DTYPE='fp8'
PROFILE_TOOL_CALL_PARSER='poolside_v1'
PROFILE_ENABLE_AUTO_TOOL_CHOICE=1
PROFILE_REASONING_PARSER='poolside_v1'
PROFILE_VLLM_EXTRA_ARGS=()
PROFILE_NOTES='2026-08-21 angelegt, 2026-08-22 gelaufen: 62 Prozent (61/98), 18 K.O., 17,25 tok/s, TTFT 163 ms, 0 Fehlfaelle, Ladezeit 14 min. GPU_MEM_UTIL 0.90 traegt: der freie Hauptspeicher lag im Lauf bei 67 bis 149 MB und der oom_kill-Zaehler des Kernels blieb bei 0 — das ist hier der Betriebszustand, kein Notfall. Der Parser poolside_v1 trennt nichts ab, weil das Modell nichts zu denken liefert: die Vorlage oeffnet <think>, das Modell schliesst sofort, und uebrig bleibt ein verwaistes </think> am Antwortanfang in 67 von 98 Faellen. Geprueft und folgenlos, davor stehen null Zeichen. Rezept auf DGX Spark validiert. 93 GB auf 128 GB Unified Memory — GPU_MEM_UTIL 0.90 (der Super traegt hier 0.92 bei 74,8 GiB), MAX_NUM_SEQS 2. 48 Schichten, 256 Experten, 10 aktiv, compressed-tensors NVFP4.'
