# vLLM Profil – ibm-granite/granite-switch-4.1-8b
#
# Granite-4.1-8B mit denselben Adaptern wie das 30B (decision, guardian-core)
# und eingebauter englischer Spracherkennung. Das 30B passt auf dem GB10 nicht:
# Das Plugin baut nach dem Laden je Schicht eine erweiterte Kopie der Gewichte
# (~1,87x des Checkpoints, Plugin-Issue #128). Beim 8B sind das ~33 GB Spitze.
# Gleiches Image spark-granite-switch:v1 (vLLM 0.30.0 + granite-switch 0.1.1),
# sonst Werte wie beim 30B: 32768 Kontext, 4 Sequenzen, KV FP8, ASR aus.
PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='spark-granite-switch:v1'
PROFILE_DTYPE='bfloat16'
PROFILE_GPU_MEM_UTIL='0.50'
PROFILE_MAX_MODEL_LEN=32768
PROFILE_MAX_NUM_SEQS=4
PROFILE_ENFORCE_EAGER=0
PROFILE_TRUST_REMOTE_CODE=0
PROFILE_KV_CACHE_DTYPE='fp8'
# Nur Text: die eingebaute Spracherkennung (asr_enabled, asr_device cuda) aus.
# Mit ihr lief der erste Start am 24.10. direkt nach dem Laden der Gewichte in
# den globalen OOM-Killer — vLLM misst den Speicher mit Platzhalter-Audio (bis
# 32 Clips zu 120 s), und das geht durch die Spracherkennung.
PROFILE_HF_OVERRIDES='{"asr_enabled": false}'
# Das Plugin baut nach dem Laden je Schicht mit Adapter eine erweiterte Kopie
# der Gewichtsmatrix (w_ext = Basis plus Adapterzeilen) und gibt das Original
# frei. Der Caching-Allocator kann den freien Block fuer die naechste, groessere
# Kopie nicht wiederverwenden; ohne expandable_segments wuchs der Speicher beim
# zweiten Start bis 8 GB vor dem Ende (Waechter griff), siehe Plugin-Issue #128.
PROFILE_DOCKER_ENV='PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True'
PROFILE_VLLM_EXTRA_ARGS=(
  '--limit-mm-per-prompt'   '{"audio":0}'
)
PROFILE_NOTES='2026-10-24 angelegt. Granite Switch 4.1 8B, eigenes Image (vLLM 0.30.0 + granite-switch 0.1.1). Werte wie beim 30B. Kein Rezept, Karte nennt keine Flags. Lizenz Apache-2.0.'
