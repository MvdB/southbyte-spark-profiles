# vLLM Profil – ornith-ai/Ornith-1.5-122B-NVFP4
#
# VORBEREITET am 2026-10-20, NOCH NICHT GESYNCT UND NICHT GEMESSEN. Nach dem
# Sync diese Datei nach ~/hf_models/ornith-ai--Ornith-1.5-122B-NVFP4/ kopieren
# und die Werte am ersten Start gegen 'docker logs vllm-server' pruefen.
# Gelesen wurde der HF-Stand dde0b1af (20.10.2026, 17:37 UTC) — das Repo ist
# an diesem Tag angelegt worden und kann sich bis zum Sync noch aendern.
#
# KEIN REZEPT. recipes.vllm.ai fuehrt Ornith nicht (models.json, 491 Eintraege,
# weder als hf_id noch als derived_from; /ornith-ai/... auch mit
# ?hardware=dgx_spark_gb10 404). Das Rezept fuer Qwen/Qwen3.5-122B-A10B gilt
# anderen Checkpoints und hat kein GB10-Profil — nicht uebernommen.
#
# QUELLE IST DAMIT DIE MODELLKARTE. Die NVFP4-Karte ist eine Kopie der Karte
# von ornith-ai/Ornith-1.5-122B, ihr Befehl nennt die Basis:
#   vllm serve ornith-ai/Ornith-1.5-122B --max-model-len 262144
#     --gpu-memory-utilization 0.90 --enable-prefix-caching
#     --enable-auto-tool-choice --tool-call-parser qwen3_xml
#     --reasoning-parser qwen3 --trust-remote-code
# Uebernommen: Parser, Auto-Tool-Choice, trust-remote-code (das Repo bringt
# keinen .py-Code mit, das Flag ist also wirkungslos, aber verlangt).
# Prefix-Caching ist in v0.27.1 ohnehin an. Mindestversion laut Karte:
# vLLM >= 0.19.1, transformers >= 5.8.1.
# NICHT uebernommen: Kontext und Auslastung — der Befehl gilt einer einzelnen
# 80-GB-Karte mit eigenem Speicher, nicht 121,6 GiB Unified Memory.
#
# Aus config.json gelesen:
#   architectures        Qwen3_5MoeForConditionalGeneration (mit Vision-Encoder)
#   48 Schichten, davon 36 lineare (Gated DeltaNet) und 12 volle Attention
#   256 Experten, 8 aktiv, plus Shared Expert  ->  122B gesamt, ~10B aktiv
#   2 KV-Koepfe, head_dim 256, max_position_embeddings 262144
#   quant_method         modelopt 0.45.0, MIXED_PRECISION:
#                        Attention FP8, Experten und lm_head NVFP4 W4A16,
#                        KV-Cache-Schema FP8, MTP-Schicht ausgenommen (BF16)
#
# IMAGE v0.27.1, weil ornith-ai--Ornith-1.5-35B-A3B-NVFP4 darauf am 21.08.2026
# durchgelaufen ist — mit demselben Format bis ins Detail: modelopt 0.45.0,
# MIXED_PRECISION, FP8 + W4A16_NVFP4, KV-Schema FP8, gleiche ignore-Liste,
# transformers 5.8.1, gleiche Architekturklasse. Start 5 min, keine
# Backend-Umgebung noetig. Die Marlin-Umgebung des Nemotron-3-Super gilt
# W4A4-Checkpoints und ist hier nicht gesetzt.
#
# MAX_NUM_BATCHED_TOKENS=8192 — NICHT 4096 wie beim 35B. Der Mamba-Align-Assert
# verlangt block_size <= max_num_batched_tokens, und block_size waechst mit
# dem GDN-Zustand. Formel aus vllm/platforms/interface.py (v0.27.1),
# _align_hybrid_block_size, mit 16er-Kernel-Ausrichtung und FP8-KV
# (2 Koepfe x 256 x 2 x 1 Byte = 1024 Byte je Token und Schicht):
#   35B:  3x8192x2 + 32x128x128x4  = 2.146.304 Byte -> 16 x ceil(131,0) = 2096
#   122B: 3x12288x2 + 64x128x128x4 = 4.268.032 Byte -> 16 x ceil(260,5) = 4176
# Die 2096 stehen so im Assert-Log von Ornith-1.0-35B-FP8 (v0.26.0, dieselben
# GDN-Dimensionen wie der 1.5-35B), die Formel ist damit geeicht. 4176 > 4096,
# mit dem 35B-Wert scheitert der Start also am selben Assert. 8192 ist die
# naechste Zweierpotenz darueber.
#
# SPEICHER (Gewichte aus der HF-API, Rest berechnet):
#   Checkpoint                77,7 GB = 72,3 GiB
#   davon MTP-Schicht (BF16)  ~5,0 GB, ohne Spekulation nicht geladen
#   geladen                   ~72,6 GB = ~67,6 GiB, Vision-Encoder inklusive
#   KV je Sequenz bei 32k     12 Schichten x 1 KiB x 32768 = 384 MiB
#   GDN-Zustand je Sequenz    36 x 4,07 MiB = 147 MiB
# Der Bedarf von zwei Sequenzen liegt also bei gut 1 GiB. GPU_MEM_UTIL 0.80
# gibt vLLM 97,3 GiB, den Rest nach den Gewichten fuellt es mit KV-Cache
# (Lehre aus Kolibri-1: vernachlaessigbar ist der Bedarf, nicht das, was
# vLLM sich nimmt). Bleiben rund 24 GiB ausserhalb von vLLM. 0.88 wie beim
# 35B ist hier nicht noetig und naeher an der Grenze, an der Kolibri-1 und
# Nemotron-3-Super-MTPv2 gekippt sind. Der Wert ist HERGELEITET, weder Karte
# noch Rezept nennen einen fuer diese Maschine.
#
# STARTBEDINGUNG: v0.27.1 nimmt auf UMA-Geraeten MemAvailable als freien
# Speicher (vllm/utils/mem_utils.py) und bricht ab, wenn weniger frei ist als
# GPU_MEM_UTIL x 121,6 GiB — hier also 97,3 GiB. Andere GPU-Dienste vorher
# stoppen.
#
# MAX_MODEL_LEN=32768 wie beim 35B-Bruder. Der Speicher wuerde mehr tragen
# (262144 kosten 3 GiB je Sequenz), aber der Harness deckelt max_tokens ohnehin
# bei 32768, die Long-Context-Faelle haben rund 1k Token Prompt, und beim 35B
# lag die laengste Ausgabe bei 24.934 Token — abgeschnitten wurde nichts.
#
# ENFORCE_EAGER=1 wie beim 35B-Bruder fuer den ersten Start. Laeuft er
# sauber, ist eine Messung mit CUDA-Graphs der naechste Schritt — dann als
# eigene Zeile, damit der Vergleich genau einen Unterschied hat.
#
# KEIN explizites PROFILE_QUANTIZATION: vLLM liest quant_method und die
# ignore-Liste aus der config.json selbst. Lehre aus den Ling-3.0-Versuchen.
#
# MTP-KOPF IST IM CHECKPOINT (mtp_num_hidden_layers=1, aus der Quantisierung
# ausgenommen). Die Karte nennt KEINE Spekulation — deshalb hier und im
# Testplan nichts dazu. Wer eine Spekulationszeile will, braucht eine Quelle
# fuer num_speculative_tokens, und der Kopf kommt mit ~5 GB aufs Budget.

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:v0.27.1'
PROFILE_BASH_WRAPPER=0
PROFILE_DTYPE='bfloat16'
PROFILE_QUANTIZATION=''
PROFILE_GPU_MEM_UTIL='0.80'
PROFILE_MAX_MODEL_LEN=32768
PROFILE_MAX_NUM_SEQS=2
PROFILE_MAX_NUM_BATCHED_TOKENS=8192
PROFILE_ENFORCE_EAGER=1
PROFILE_TRUST_REMOTE_CODE=1
PROFILE_KV_CACHE_DTYPE='fp8'
PROFILE_TOOL_CALL_PARSER='qwen3_xml'
PROFILE_REASONING_PARSER='qwen3'
PROFILE_ENABLE_AUTO_TOOL_CHOICE=1
PROFILE_VLLM_EXTRA_ARGS=()
PROFILE_NOTES='2026-10-20 vorbereitet, nicht gesynct, nicht gemessen. Kein Rezept auf recipes.vllm.ai; Quelle ist die Modellkarte (Kopie der Basiskarte ornith-ai/Ornith-1.5-122B): Parser qwen3_xml/qwen3, trust-remote-code, vLLM >= 0.19.1. Image v0.27.1, weil Ornith-1.5-35B-A3B-NVFP4 mit identischem modelopt-Format (FP8 + W4A16_NVFP4, KV FP8) darauf lief. MAX_NUM_BATCHED_TOKENS 8192 statt 4096: berechnete block_size 4176 im Mamba-Align-Modus. GPU_MEM_UTIL 0.80 hergeleitet: ~67,6 GiB Gewichte geladen, KV-Bedarf ~1 GiB fuer 2 Sequenzen bei 32k; Start braucht 97,3 GiB MemAvailable. MTP-Kopf im Checkpoint, Karte nennt keine Spekulation. Lizenz MIT nur in den Metadaten, LICENSE-Datei fehlt in beiden Repos.'
