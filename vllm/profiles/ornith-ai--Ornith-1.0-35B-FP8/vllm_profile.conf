# vLLM Profil – ornith-ai--Ornith-1.0-35B-FP8
# 2026-08-10 HF-Card-Recipe (huggingface.co/ornith-ai/Ornith-1.0-35B-FP8 →
# Basis deepreinforce-ai/Ornith-1.0-35B). Ersetzt Auto-Profil, dessen Annahmen
# (qwen3_coder-Parser, num_gpu_blocks_override=512, kein trust-remote-code) falsch waren.
#
# Card: --trust-remote-code, --tool-call-parser qwen3_xml, --reasoning-parser qwen3,
#       --enable-prefix-caching, vLLM >=0.19.1 (wir: 0.26.0 → reicht), Arch Qwen3.5-MoE.
# Single-GB10-Anpassung: TP=1 (Card nutzt TP=8), max_model_len 262144→32768 (KV-Budget).

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DTYPE='bfloat16'
PROFILE_GPU_MEM_UTIL='0.88'
PROFILE_MAX_MODEL_LEN=32768
PROFILE_MAX_NUM_SEQS=2
PROFILE_ENFORCE_EAGER=1
PROFILE_TRUST_REMOTE_CODE=1
PROFILE_KV_CACHE_DTYPE='fp8'
PROFILE_TOOL_CALL_PARSER='qwen3_xml'
PROFILE_REASONING_PARSER='qwen3'
PROFILE_ENABLE_AUTO_TOOL_CHOICE=1
# 2026-08-11 (echter Fix): prefix-caching ist in vLLM v0.26 per DEFAULT an — das Weglassen
# des Flags brachte nichts (Log zeigte weiter enable_prefix_caching=True → gleicher Assert).
# Der Assert will nur block_size(2096) <= max_num_batched_tokens. Also max_num_batched_tokens
# auf 4096 heben → 2096 <= 4096 erfüllt, prefix-caching bleibt an.
PROFILE_MAX_NUM_BATCHED_TOKENS=4096
PROFILE_VLLM_EXTRA_ARGS=()
PROFILE_NOTES='2026-08-11 HF-Card: trust-remote-code + qwen3_xml/qwen3-Parser. max_num_batched_tokens=4096 gegen Mamba-align-Assert (block_size 2096 muss <= max_num_batched_tokens; prefix-caching ist Default-an, nicht abschaltbar durchs Weglassen). Arch Qwen3.5-MoE, FP8 (auto). TP=1, max_model_len 32k.'
