# vLLM Profil – google/gemma-4-E4B-it
#
# 2026-10-24 neu angelegt als Basis-Vergleich zu nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-BF16
# (NVIDIAs Nachtraining dieses Modells). Darum mit DENSELBEN Werten wie das
# Bolt-Profil: vLLM v0.31.0, max-model-len 65536, max-num-seqs 64,
# max-num-batched-tokens 65536, KV-Cache auto, Parser gemma4, keine Bild-, Audio-
# oder Videoeingabe, GPU_MEM_UTIL 0.50. Einziger Unterschied: die Chat-Vorlage
# aus dem eigenen Modellordner (vLLM nimmt sie von selbst).
#
# Abweichung vom Rezept recipes.vllm.ai/Google/gemma-4-E4B-it: Das nennt das
# Spezial-Image vllm/vllm-openai:gemma4-0505-cu129 (Mai), max-model-len 16384,
# Bild 4 und Audio 1, async-scheduling. Fuer einen Vergleich mit Bolt zaehlt
# gleiches Serving mehr als das aeltere Spezial-Image; v0.31.0 kann gemma4.
# Die fruehere Fassung (v0.23.0, eager, fp8-KV) war fuer die Kohorte C.
PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:v0.31.0'
PROFILE_BASH_WRAPPER=0
PROFILE_DTYPE='bfloat16'
PROFILE_QUANTIZATION=''
PROFILE_GPU_MEM_UTIL='0.50'
PROFILE_MAX_MODEL_LEN=65536
PROFILE_MAX_NUM_SEQS=64
PROFILE_MAX_NUM_BATCHED_TOKENS=65536
PROFILE_ENFORCE_EAGER=0
PROFILE_KV_CACHE_DTYPE='auto'
PROFILE_TOOL_CALL_PARSER='gemma4'
PROFILE_REASONING_PARSER='gemma4'
PROFILE_ENABLE_AUTO_TOOL_CHOICE=1
PROFILE_VLLM_EXTRA_ARGS=(
  '--limit-mm-per-prompt'   '{"image":0,"video":0,"audio":0}'
)
PROFILE_NOTES='2026-10-24 als Basis-Vergleich zu Nemotron-3.5-Bolt-E4B angelegt: Serving identisch zum Bolt-Profil. Lizenz Apache-2.0.'
