# vLLM Profil – onprem-ai--Apertus-v1.5-70B-FP8
# 2026-08-11: FP8_DYNAMIC von swiss-ai/Apertus-v1.5-70B (Card: 71 GiB, 1.9x, no measurable loss).
# Genau der Grund, warum FP8 statt bf16: bf16-70B = 135 GiB passt NICHT in 121 GB; FP8 = 71 GiB passt.
# Basis = valides swiss-ai--Apertus-v1.5-8B-Profil + onprem-Card-Args (tool+reasoning-parser apertus).
# Arch apertus1p5 → swiss-ai-Image (Stock-vLLM kennt apertus1p5 nicht). BASH_WRAPPER (Entrypoint-Fix).
# Multimodal (vision+wav-Tokenizer bleiben BF16) — wir testen nur Text; falls MM-Profiling beim Start
# crasht: PROFILE_VLLM_EXTRA_ARGS um '--limit-mm-per-prompt {"image":0}' ergänzen.

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='ghcr.io/swiss-ai/vllm_apertus_1.5_release:latest-arm64'
PROFILE_BASH_WRAPPER=1
PROFILE_DTYPE='bfloat16'          # Weights sind FP8 (compressed-tensors), auto-detektiert
PROFILE_GPU_MEM_UTIL='0.88'       # 71GB Weights + KV in ~106GB Pool, ~15GB Host-Headroom
PROFILE_MAX_MODEL_LEN=16384       # native 262k → 16k (Eval-Kontext, KV-Budget), Card nennt ~60k möglich
PROFILE_MAX_NUM_SEQS=2
PROFILE_ENFORCE_EAGER=1           # 70B erster Lauf konservativ (kein CUDA-Graph-Speicher)
PROFILE_TRUST_REMOTE_CODE=0
PROFILE_KV_CACHE_DTYPE='fp8'
PROFILE_TOOL_CALL_PARSER='apertus'
PROFILE_REASONING_PARSER='apertus'
PROFILE_ENABLE_AUTO_TOOL_CHOICE=1
PROFILE_VLLM_EXTRA_ARGS=('--chat-template-content-format' 'string')
PROFILE_NOTES='2026-08-11: onprem-ai FP8_DYNAMIC von swiss-ai Apertus-v1.5-70B. FP8 71GiB passt (bf16 135GiB nicht). swiss-ai-Image + BASH_WRAPPER, apertus tool+reasoning-parser laut onprem-Card, chat-template-content-format string. gpu_mem 0.88, max_model_len 16k, enforce_eager. FP8 auto aus config (kein --quantization). Bei MM-Startup-Fail: limit-mm image:0.'
