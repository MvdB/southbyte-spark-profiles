# vLLM Profil – RadixArk/Qwen3.8-27B-NVFP4
#
# Qwen3.8-27B (dense, Hybrid-Attention, Vision-Tower) in einer NVFP4-Fassung von
# RadixArk (modelopt, MIXED_PRECISION). Erstmals gebraucht fuer die Vision-Dimension
# (Plan Abschnitt 6); im LLM-Testplan bisher nicht gemessen.
#
# Rezept recipes.vllm.ai/Qwen/Qwen3.8-27B (DGX Spark verified) nennt RadixArk nicht.
# Naechste Variante ist nvfp4_nvidia (nvidia/Qwen3.8-27B-NVFP4, ebenfalls modelopt),
# deren dgx_spark_gb10-Overrides gelten hier: KV-Cache fp8, gpu-memory-utilization 0,7.
# Kontext 131072 wie die kuratierte Schwester RedHatAI--Qwen3.8-27B-NVFP4 (Rezept:
# 262144 — fuer den Testplan reicht weniger, das spart KV-Speicher). Image v0.27.1 wie
# die Schwester; das Rezept verweist auf einen Fork-Build "qwen38" im 0.27er-Bereich.
# Reasoning-Parser qwen3 laut Rezept (sonst landet <think> im content).
PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:v0.27.1'
PROFILE_BASH_WRAPPER=0
PROFILE_DTYPE='bfloat16'
PROFILE_GPU_MEM_UTIL='0.70'
PROFILE_MAX_MODEL_LEN=131072
PROFILE_MAX_NUM_SEQS=4
PROFILE_MAX_NUM_BATCHED_TOKENS=4096
PROFILE_ENFORCE_EAGER=0
PROFILE_TRUST_REMOTE_CODE=0
PROFILE_KV_CACHE_DTYPE='fp8'
PROFILE_VLLM_EXTRA_ARGS=('--reasoning-parser' 'qwen3')
PROFILE_NOTES='2026-10-25 angelegt fuer die Vision-Dimension. Abgeleitet aus RedHatAI--Qwen3.8-27B-NVFP4 plus den dgx_spark_gb10-Werten der Rezeptvariante nvfp4_nvidia (kv fp8, util 0,7). Noch nicht gestartet.'
