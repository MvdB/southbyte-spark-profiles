# vLLM Profil – Aleph-Alpha--Kolibri-1
#
# GEMESSEN am 2026-10-07 — Smoke-Test bestanden, siehe PROFILE_NOTES.
# Die Werte stammen aus einem Lauf auf dieser Maschine, nicht mehr nur aus
# der Modellkarte.
#
# Kein Rezept auf recipes.vllm.ai (458 geprüft, 07.10.2026) — die Modellkarte
# ist hier die Quelle.
#
# Was dieses Modell von den anderen großen unterscheidet: es ist
# GEWICHTSGEBUNDEN, nicht KV-gebunden. 50 Schichten, davon nur 10 mit voller
# Aufmerksamkeit, die übrigen 40 gleitend mit Fenster 513. Bei 4 KV-Köpfen
# à 128 und fp8-KV macht das 1 KiB je Token und Schicht:
#
#     Kontext  16k →  0,18 GiB je Sequenz
#     Kontext  32k →  0,33 GiB je Sequenz
#     Kontext 262k →  2,52 GiB je Sequenz   (nativ trainierte Länge)
#
# Der KV-Cache ist also vernachlässigbar; die 78 GB Gewichte sind die ganze
# Rechnung. Deshalb ist hier Kontext billig und darf großzügig stehen — anders
# als bei Nemotron-3-Super, wo 0.92 die Maschine ins OOM trieb.
#
# GEMESSEN 07.10.2026: mit 0.88/32k/2 laedt das Modell (365 s), beantwortet eine
# kurze Anfrage korrekt — und stirbt bei 3000 Token Ausgabe mit OOMKilled. vLLM
# legte einen KV-Pool fuer 2,24 Mio. Token an und belegte 111 von 121,6 GiB; fuer
# die Aktivierungen einer langen Denkspur blieb nichts. Mein Schluss, KV sei
# vernachlaessigbar, war falsch: vernachlaessigbar ist der BEDARF je Sequenz,
# nicht das, was vLLM sich nimmt, wenn man es laesst.
#
# ACHTUNG Speicher: die Modellkarte nennt als Minimum 1x H200 (141 GB) oder
# 2x A100 80. Diese Maschine hat 121 GB unified — UNTER dem genannten Minimum.
# Die Rechnung geht trotzdem auf (78 GB Gewichte + ~1 GiB KV bei 32k und 2
# Sequenzen), aber der erste Start ist der eigentliche Test. Geht er schief:
# GPU_MEM_UTIL senken, nicht den Kontext.

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='spark-kolibri1:v1'   # custom/Dockerfile.kolibri1, muss gebaut sein
PROFILE_DTYPE='bfloat16'                   # Gewichte sind fp8 (quantization_config), auto-erkannt
PROFILE_GPU_MEM_UTIL='0.80'                # 07.10. nach OOM: 0.88 ergab 111 GiB belegt, Engine starb
PROFILE_MAX_MODEL_LEN=8192                 # 07.10. nach OOM von 32k gesenkt; zwingt den KV-Pool klein
PROFILE_MAX_NUM_SEQS=1
PROFILE_ENFORCE_EAGER=1                    # erster Lauf konservativ, kein CUDA-Graph-Speicher
PROFILE_TRUST_REMOTE_CODE=0                # die Architektur kommt aus dem Plugin, nicht aus dem Repo
PROFILE_KV_CACHE_DTYPE='fp8'               # so steht es auf der Modellkarte
PROFILE_REASONING_PARSER='kolibri1'
PROFILE_TOOL_CALL_PARSER='kolibri1'
PROFILE_ENABLE_AUTO_TOOL_CHOICE=1
PROFILE_NOTES='2026-10-07 GEMESSEN, Smoke-Test bestanden: Laden 511 s, 101 von 121,6 GiB belegt, KV-Pool 764k Token. Kurze deutsche Anfrage korrekt und vollstaendig; 3000-Token-Lauf durch; reasoning_effort=high ohne Absturz; Werkzeugaufruf belegt (wetter mit ort=Muenchen, finish_reason tool_calls). ERSTER VERSUCH mit 0.88/32k/2 Sequenzen STARB mit OOMKilled bei 3000 Token Ausgabe: vLLM legte einen KV-Pool fuer 2,24 Mio. Token an und belegte 111 GiB. Lehre: vernachlaessigbar ist der KV-BEDARF je Sequenz, nicht das, was vLLM sich nimmt, wenn man es laesst. ACHTUNG reasoning_effort=high verbrennt das Budget — 5999 von 6000 Token gingen ins Denken, Inhalt kam keiner (gleiches Muster wie Nemotron-Lightning think-001); fuer die Evaluation medium nehmen. OFFEN: max_model_len 8192 steht gegen eine Denkspur von 6000 Token, fuer die Playbooks koennte das knapp werden. 78B-A3.5B MoE 78B-A3.5B MoE (384 Experten, 6 aktiv), fp8 Blockquantisierung 128x128, Apache-2.0, deutsch/englisch. Serving-Flags wörtlich von der Modellkarte: --kv-cache-dtype fp8 --reasoning-parser kolibri1 --tool-call-parser kolibri1 --enable-auto-tool-choice. Architektur kolibri1 kennt nur das Plugin aleph-alpha-inference (>=1), das vllm 0.29.x verlangt; nur v0.29.0 gibt es als arm64-Marke. Sampling laut Karte und generation_config: temperature 1.0, top_p 0.97, top_k 128. Reasoning-Stufen über chat_template_kwargs reasoning_effort low|medium|high|none bzw. enable_thinking=false. Kein Rezept auf recipes.vllm.ai. KV ist vernachlässigbar (40 von 50 Schichten gleitend, Fenster 513): 0,33 GiB je Sequenz bei 32k. Die Karte nennt 1x H200 als Minimum, diese Maschine hat 121 GB — der erste Start ist der eigentliche Test.'
