# vLLM Profil – nvidia--NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
#
# VORBEREITET am 2026-10-16, NOCH NICHT GEMESSEN. Das Modell wird gerade
# gesynct (75,1 GB, 114 Dateien).
#
# QUELLE: recipes.vllm.ai fuehrt dieses Modell mit einem EIGENEN, als
# "verified" markierten Hardware-Profil fuer dgx_spark_gb10. Jeder Wert unten
# steht so in hw/dgx_spark_gb10.json. Nicht aus der Modellkarte abgeleitet —
# deren Beispielbefehl gilt einer GB200 mit 1M Kontext und 512 Sequenzen.
#
# ACHTUNG VERSION: die Modellkarte nennt vLLM 0.32.0, das Rezept 0.31.0. Es
# gibt KEINE arm64-Marke fuer v0.32.0 (geprueft 16.10.), fuer v0.31.0 schon —
# und min_vllm_version im Rezept sagt ebenfalls 0.31.0. Wir folgen dem Rezept.
#
# WARUM GPU_MEM_UTIL 0.7 UND NICHT 0.92 WIE BEIM 3-SUPER: so steht es im
# Rezept. Das Modell ist ein Mamba-Transformer-Hybrid mit eigenem
# SSM-Cache, der NEBEN dem KV-Cache liegt und von der Auslastungszahl nicht
# erfasst wird. Nemotron-3-Super-MTPv2 hat die Maschine am 22.08. mit 0.92 ins
# NVRM-OOM getrieben, und dort war der Drafter das Zusatzgewicht. Hier ist es
# der SSM-Cache. Wer die Zahl anhebt, hebt sie gegen das Rezept.
#
# KEINE SPEKULATION in dieser Zeile. Das Rezept fuehrt MTP als Opt-in-Feature
# mit eigenen GB10-Argumenten, nicht als Teil der Grundkonfiguration — und die
# Kohorte trennt Grundlinie und Spekulation ohnehin in zwei Zeilen, damit ein
# Vergleich genau einen Unterschied hat.

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:v0.31.0'
PROFILE_TRUST_REMOTE_CODE=1
PROFILE_GPU_MEM_UTIL='0.7'
PROFILE_MAX_MODEL_LEN=114688
PROFILE_MAX_NUM_SEQS=2
PROFILE_TOOL_CALL_PARSER='qwen3_coder'
PROFILE_REASONING_PARSER='nemotron_v3'
PROFILE_ENABLE_AUTO_TOOL_CHOICE=1
# Der Rest des Rezepts, wortgleich. --chat-template-content-format string ist
# bei einem VL-Modell kein Schoenheitsfehler: ohne ihn erwartet das Template
# Inhaltslisten statt Zeichenketten, und der rein textliche Testplan schickt
# Zeichenketten.
PROFILE_VLLM_EXTRA_ARGS=(
  '--mamba-backend' 'flashinfer'
  '--mamba-ssm-cache-dtype' 'float16'
  '--enable-mamba-cache-stochastic-rounding'
  '--mamba-cache-philox-rounds' '5'
  '--mamba-cache-mode' 'align'
  '--prefix-match-unit' '16'
  '--enable-mamba-shared-prefix-checkpoint'
  '--chat-template-content-format' 'string'
)
PROFILE_NOTES='2026-10-16 VORBEREITET, nicht gemessen. 120B-A12B Mamba-2-Transformer-Hybrid-MoE, NVFP4, OpenMDW-1.1, VISION-LANGUAGE (Text, Bild, Video). Jeder Wert aus dem als verified markierten GB10-Profil von recipes.vllm.ai (hw/dgx_spark_gb10.json), nicht aus der Modellkarte — deren Befehl gilt einer GB200 mit 1M Kontext und 512 Sequenzen. Image v0.31.0 laut Rezept; die Modellkarte nennt 0.32.0, davon gibt es keine arm64-Marke. GPU_MEM_UTIL 0.7 statt der 0.92 des 3-Super, weil der SSM-Cache neben dem KV-Cache liegt und von der Auslastungszahl nicht erfasst wird. Sampling laut Karte: Text temperature 1.0 top_p 0.95, Vision 0.6/0.95. Denken ueber chat_template_kwargs enable_thinking, dazu medium_effort. OFFEN: der Testplan misst nur Text — die Vision-Faehigkeit bliebe ungemessen.'
