# vLLM Profil – meta-models--Muse-Glimmer-30B
# 2026-08-11 REZEPT: https://recipes.vllm.ai/meta-models/Muse-Glimmer-30B
# Stock-vLLM 0.26 kennt die Meta-Arch `muse_glimmer` NICHT (erster Test: exit=1). Das Rezept
# nennt ein SPEZIAL-Image mit registrierter Arch: vllm/vllm-openai:muse-glimmer (vLLM 0.27+),
# analog zum swiss-ai-Apertus-Image. Custom-Parser `muse_glimmer` für tool + reasoning.
#
# Single-GPU (GB10)-Variante aus dem Rezept: TP=1, --tool-call-parser/--reasoning-parser muse_glimmer,
# --enable-auto-tool-choice, --generation-config auto. Reasoning-Parser braucht skip_special_tokens=False
# (Channel-Marker) — vom Image/Parser gehandhabt; falls Eval-Antworten Marker zeigen, im Harness setzen.
# Multimodal (Perception-Encoder) → wir testen Text: limit-mm image:0 gegen MM-Profiling-Overhead.
# ACHTUNG: Image-Arch (arm64?) vor dem Lauf verifizieren (docker pull).

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:muse-glimmer'
PROFILE_DTYPE='bfloat16'
PROFILE_GPU_MEM_UTIL='0.85'
PROFILE_MAX_MODEL_LEN=32768        # native 131k → 32k (Eval-Kontext, KV-Budget für 30B + ViT)
PROFILE_MAX_NUM_SEQS=2
PROFILE_ENFORCE_EAGER=1            # erster Lauf konservativ
PROFILE_TRUST_REMOTE_CODE=1
PROFILE_TOOL_CALL_PARSER='muse_glimmer'
PROFILE_REASONING_PARSER='muse_glimmer'
PROFILE_ENABLE_AUTO_TOOL_CHOICE=1
PROFILE_VLLM_EXTRA_ARGS=('--generation-config' 'auto' '--limit-mm-per-prompt' '{"image":0}')
PROFILE_NOTES='2026-08-11 Rezept recipes.vllm.ai: Spezial-Image vllm/vllm-openai:muse-glimmer (vLLM 0.27+, registriert muse_glimmer-Arch). Custom-Parser muse_glimmer (tool+reasoning), --generation-config auto, TP=1, image:0 (Text-Eval). Erst-Test scheiterte an Stock-vLLM ohne Arch. Vor Lauf: Image pullen + arm64 prüfen; reasoning braucht skip_special_tokens=False.'
