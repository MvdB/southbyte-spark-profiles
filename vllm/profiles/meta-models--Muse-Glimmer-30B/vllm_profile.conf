# vLLM Profil – meta-models--Muse-Glimmer-30B
# 2026-08-11 REZEPT: https://recipes.vllm.ai/meta-models/Muse-Glimmer-30B
# Stock-vLLM 0.26 kennt die Meta-Arch `muse_glimmer` NICHT (erster Test: exit=1). Das Rezept
# nennt ein SPEZIAL-Image mit registrierter Arch: vllm/vllm-openai:muse-glimmer,
# analog zum swiss-ai-Apertus-Image. Custom-Parser `muse_glimmer` für tool + reasoning.
# 2026-08-16 nachgesehen: das Image meldet 0.26.1rc1.dev608+g99a10304d, nicht
# "0.27+" wie hier bis dahin stand — ein Vorabstand zwischen den Releases.
# Upstream steht inzwischen v0.27.1. Beim naechsten Leerlauf pruefen, ob Stock
# die Arch `muse_glimmer` und die Spec-Methode `dflash` mitbringt; dann faellt
# das Spezial-Image weg und mit ihm die Frage nach seiner Architektur.
#
# Single-GPU (GB10)-Variante aus dem Rezept: TP=1, --tool-call-parser/--reasoning-parser muse_glimmer,
# --enable-auto-tool-choice, --generation-config auto.
# (Die Annahme vom 2026-08-11, der Reasoning-Parser brauche skip_special_tokens=False,
#  ist am 2026-08-13 widerlegt worden - siehe Messmatrix unten.)
# Multimodal (Perception-Encoder) → wir testen Text: limit-mm image:0 gegen MM-Profiling-Overhead.
# ACHTUNG: Image-Arch (arm64?) vor dem Lauf verifizieren (docker pull).

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:muse-glimmer'
PROFILE_DTYPE='bfloat16'
PROFILE_GPU_MEM_UTIL='0.85'
PROFILE_MAX_MODEL_LEN=32768        # native 131k → 32k (Eval-Kontext, KV-Budget für 30B + ViT)
PROFILE_MAX_NUM_SEQS=2
# 2026-08-13: eager AUS - bringt hier aber NICHTS. Gemessen mit CUDA-Graphs:
#   TTFT 1.02-1.17 s, 4.2 tok/s; vorher eager: 1.58 s / 4.0 tok/s.
#   Das Modell ist speicherbandbreitenlimitiert, nicht rechenlimitiert:
#   273 GB/s / 56 GiB Gewichte = 4.9 tok/s theoretisch, gemessen 4.2 (86 %).
#   Zum Vergleich NVFP4 mit 22 GiB: 273/22 = 12.4 theoretisch, gemessen 12.3.
#   Daraus wurde gefolgert: "Schneller wird BF16 auf dieser Maschine nicht -
#   nur kleiner hilft."
#
# 2026-08-16: Diese Folgerung ist WIDERLEGT. Sie gilt fuer Dekodierung Token
#   fuer Token; DFlash umgeht sie, weil das Zielmodell einen ganzen 16er-Block
#   in einem Durchgang verifiziert. Gemessen mit dem Drafter (s.u.):
#
#     BF16 ohne Spekulation    4,2 tok/s
#     NVFP4 22 GiB            12,3 tok/s
#     BF16 + DFlash     22,2 / 23,2 tok/s     <- 5,3x, schlaegt auch NVFP4
#
#   Die Bandbreitenrechnung bleibt richtig, sie begrenzt nur nicht mehr das
#   Ergebnis. Kleiner hilft weiterhin - aber spekulieren hilft hier mehr.
PROFILE_ENFORCE_EAGER=0
PROFILE_TRUST_REMOTE_CODE=1
PROFILE_TOOL_CALL_PARSER='muse_glimmer'
# 2026-08-13 VERIFIZIERT (korrigiert): Parser AN, sonst nichts noetig.
#   Leere Antworten (content=null) kommen AUSSCHLIESSLICH von zu kleinem
#   max_tokens - nicht von skip_special_tokens (irrelevant) und nicht von
#   der Temperatur. Messmatrix 2026-08-13, Frage 'Antworte mit genau einem Wort':
#     temp 0.1 / max_tokens  200 -> content LEER   (finish=length)
#     temp 1.0 / max_tokens  200 -> content LEER   (finish=length)
#     temp 0.1 / max_tokens 2048 -> content 'Ja'   (finish=stop, 387 Tok)
#     temp 1.0 / max_tokens 2048 -> content 'Ja'   (finish=stop, 382 Tok)
#   Das Modell denkt vor JEDER Antwort lange - je kuerzer die erwartete
#   Antwort, desto laenger die Analyse. Faustregel: max_tokens >= 1024.
#   Der Analysetext landet sauber in 'reasoning', die Antwort in 'content'.
#   (Frueherer Eintrag behauptete skip_special_tokens=false sei Pflicht -
#    das war ein Fehlschluss aus einem Test mit zu kleinem Token-Budget.)
PROFILE_REASONING_PARSER='muse_glimmer'
# 2026-08-16 DFlash-Spekulation, gemessen und wirksam. Nicht als Vorgabe
# gesetzt, weil die Grundlinie ohne Spekulation vergleichbar bleiben soll —
# zum Einschalten:
#
#   VLLM_EXTRA_ARGS='--speculative-config {"model":"/hf_models/meta-models--Muse-Glimmer-30B-assistant","num_speculative_tokens":16}'
#
# Die Methode muss nicht angegeben werden: vLLM erkennt sie an
# MuseGlimmerAssistantModel in den architectures des Drafters und setzt
# method='dflash' selbst. 16 Token entsprechen dem block_size des Drafters.
# Der Drafter (meta-models/Muse-Glimmer-30B-assistant, 4,8 GiB, 5 Schichten
# sliding_attention) steht seit dem 16.08. in der LocalCache-Collection —
# ohne Eintrag dort holt die Retention in sync_all.sh ihn wieder weg.
#
# Die Akzeptanz haengt stark an der Textsorte:
#   Avg Draft acceptance    17,1 % ... 74,7 %
#   Mean acceptance length   3,74  ...  12,95   von 16
# Bei freiem Text bricht sie nach zwei bis drei Positionen ein, bei
# repetitivem haelt sie ueber den ganzen Block. Die 22-23 tok/s oben sind
# also ein guenstiger Fall, kein Dauerwert.
#
# Beim Start warnt vLLM: max_num_scheduled_tokens faellt wegen der
# Spec-Einstellungen auf 2048. Ungeprueft, ob ein hoeheres
# max_num_batched_tokens noch etwas bringt.
#
# vLLM meldet ausserdem, dass der Drafter keine externen multimodalen
# Embeddings annimmt und textonly draftet. Fuer die Text-Evaluation
# (limit-mm image:0) ohne Belang.
PROFILE_ENABLE_AUTO_TOOL_CHOICE=1
PROFILE_VLLM_EXTRA_ARGS=('--generation-config' 'auto' '--limit-mm-per-prompt' '{"image":0}')
PROFILE_NOTES='2026-08-16 DFlash gemessen: 22,2-23,2 tok/s gegen 4,2 ohne Spekulation (5,3x), schlaegt auch die NVFP4-Variante mit 12,3. Drafter meta-models/Muse-Glimmer-30B-assistant, --speculative-config siehe Kopf. 2026-08-11 Rezept recipes.vllm.ai: Spezial-Image vllm/vllm-openai:muse-glimmer (vLLM 0.27+, registriert muse_glimmer-Arch). Custom-Parser muse_glimmer (tool+reasoning), --generation-config auto, TP=1, image:0 (Text-Eval). Erst-Test scheiterte an Stock-vLLM ohne Arch. Image arm64 bestaetigt 2026-08-13. Leere Antworten kommen nur von zu kleinem max_tokens (>=1024 setzen), nicht von skip_special_tokens.'
