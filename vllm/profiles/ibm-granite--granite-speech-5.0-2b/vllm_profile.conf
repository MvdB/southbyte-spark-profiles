# vLLM Profil – ibm-granite/granite-speech-5.0-2b
#
# Spracherkennung und -übersetzung, laut Karte auch Deutsch. Kein Rezept auf
# recipes.vllm.ai. Quelle ist die Modellkarte, Abschnitt „Usage with vLLM“:
# stock vLLM, limit_mm_per_prompt audio 1, max_model_len 2048 „für schwächere
# Geräte“. Hier 4096 wie beim Vorgänger 4.1-2b, damit lange Kalibrier-Clips
# samt Prompt passen. Gleiche Architektur wie 4.1 (GraniteSpeechForConditionalGeneration).
# vllm[audio] beim Start nachinstallieren wie beim Vorgänger.
#
# Einsatz: Kandidat im Judge-Vergleich von southbyte-tts (eval/judge_bench.py)
# über /v1/audio/transcriptions.
PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:v0.31.0'
PROFILE_DTYPE='bfloat16'
PROFILE_GPU_MEM_UTIL='0.20'
PROFILE_MAX_MODEL_LEN=4096
PROFILE_MAX_NUM_SEQS=4
PROFILE_ENFORCE_EAGER=0
PROFILE_TRUST_REMOTE_CODE=0
PROFILE_KV_CACHE_DTYPE=''
PROFILE_BASH_WRAPPER=1
PROFILE_PRE_SERVE_CMD='pip install vllm[audio]'
PROFILE_VLLM_EXTRA_ARGS=(
  '--limit-mm-per-prompt'   '{"audio": 1}'
  '--served-model-name'     'granite-speech-5.0-2b' '/hf_models/ibm-granite--granite-speech-5.0-2b'
)
PROFILE_NOTES='2026-10-24 angelegt nach Modellkarte (kein Rezept). STT mit Deutsch; Judge-Kandidat fuer southbyte-tts. ASR via /v1/audio/transcriptions.'
